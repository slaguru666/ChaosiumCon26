<svg width="680" height="580" viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg">
<title>95-ART-07 The Core Chamber — the constructed singularity at the heart of the Weather Spire</title>
<style>text{font-family:sans-serif;fill:#1a1a1a;}</style>
<defs>
<pattern id="bs" patternUnits="userSpaceOnUse" width="40" height="40"><line x1="0" y1="40" x2="40" y2="0" stroke="#1a1a1a" stroke-width="0.3" opacity="0.2"/><line x1="0" y1="0" x2="40" y2="40" stroke="#1a1a1a" stroke-width="0.3" opacity="0.2"/></pattern>
</defs>
<!-- Background: Ringworld superstructure -->
<line x1="40" y1="40" x2="640" y2="540" stroke="#1a1a1a" stroke-width="0.5" opacity="0.15"/><line x1="640" y1="40" x2="40" y2="540" stroke="#1a1a1a" stroke-width="0.5" opacity="0.15"/><line x1="40" y1="200" x2="640" y2="380" stroke="#1a1a1a" stroke-width="0.4" opacity="0.12"/><line x1="640" y1="200" x2="40" y2="380" stroke="#1a1a1a" stroke-width="0.4" opacity="0.12"/>
