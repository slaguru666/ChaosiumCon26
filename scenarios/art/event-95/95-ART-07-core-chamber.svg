<text x="552" y="276" text-anchor="middle" font-size="10" fill="#1a1a1a" transform="rotate(8,552,276)">VARIABLES INTERFERE</text>
<text x="340" y="468" text-anchor="middle" font-size="10" fill="#1a1a1a">RESOLUTION PENDING</text>
