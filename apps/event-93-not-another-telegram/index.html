<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event 93 – Not Another Telegram | GM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#080706;--surface:#0e0c0a;--surface-hi:#141210;--surface-top:#1c1a17;
  --border:#1e1c18;--border-hi:#2e2b25;--text:#c8c0a8;--text-sub:#8a8070;--text-muted:#555045;
  --amber:#c8960a;--amber-hi:#e8b020;--amber-dim:#7a5a08;--orange:#d87030;
  --intro:#b8860b;--act1:#7b52a8;--act2:#8b6030;--act3:#9a2020;--epilogue:#3a7a60;
  --intro-dim:#5a4005;--act1-dim:#3a2060;--act2-dim:#4a3018;--act3-dim:#4a1010;--epilogue-dim:#1a4030;
  --red:#cc3333;--green:#4a9a4a;
  --keeper-bg:#080e08;--keeper-brd:#163016;--keeper-txt:#6a9a6a;
  --ra-bg:#0e0900;--ra-brd:#7a5010;--ra-txt:#d0a040;
  --font-mono:'Share Tech Mono','Courier New',monospace;
  --font-serif:'Special Elite',serif;--r:4px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-mono);font-size:14px;line-height:1.5;overflow:hidden;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#2a2820;border-radius:3px}::-webkit-scrollbar-thumb:hover{background:#3a3830}
#app{display:grid;grid-template-rows:52px 1fr;grid-template-columns:196px 1fr;grid-template-areas:"header header""sidebar main";height:100vh;overflow:hidden}
@media(max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:52px 1fr 52px;grid-template-areas:"header""main""sidebar"}
#sidebar{flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:none;border-top:1px solid var(--border)}
.act-label-hd{display:none}.scene-btn span{display:none}.scene-btn{min-width:36px;justify-content:center}}
#header{grid-area:header;background:var(--surface);border-bottom:2px solid var(--border-hi);display:flex;align-items:center;padding:0 16px;gap:12px}
#hdr-badge{font-size:10px;color:var(--text-muted);letter-spacing:.15em;text-transform:uppercase;white-space:nowrap}
#hdr-title{font-family:var(--font-serif);font-size:16px;color:var(--amber-hi);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr-spacer{flex:1}
#manifestation-bar{display:flex;align-items:center;gap:8px;flex-shrink:0;background:var(--surface-top);border:1px solid var(--border-hi);border-radius:var(--r);padding:4px 10px}
#man-label{font-size:9px;color:var(--text-muted);letter-spacing:.12em;white-space:nowrap}
#man-pips{display:flex;gap:3px}
.man-pip{width:10px;height:10px;border-radius:2px;border:1px solid #333;background:var(--surface);cursor:pointer;transition:all .15s}
.man-pip.filled{background:var(--red);border-color:#cc3333;box-shadow:0 0 4px #cc333366}
#tab-bar{display:flex;height:52px;gap:0}
.tab-btn{background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;padding:0 13px;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:var(--text-muted);height:52px;white-space:nowrap;transition:color .15s,border-color .15s}
.tab-btn:hover{color:var(--text)}
#hdr-nav{display:flex;gap:6px;flex-shrink:0}
.nav-arrow{background:none;border:1px solid var(--border-hi);border-radius:var(--r);color:var(--text-muted);cursor:pointer;padding:4px 10px;font-size:10px;font-family:var(--font-mono);white-space:nowrap;transition:all .15s}
.nav-arrow:hover{color:var(--text);border-color:var(--border-hi)}
#sidebar{grid-area:sidebar;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
.act-block{padding:8px 0 4px}
.act-label-hd{font-size:9px;color:var(--amber-dim);letter-spacing:.15em;font-weight:bold;padding:4px 12px 3px;text-transform:uppercase}
.scene-btn{width:100%;background:transparent;border:none;border-left:2px solid transparent;cursor:pointer;padding:5px 10px 5px 12px;text-align:left;display:flex;align-items:center;gap:6px;color:var(--text-muted);font-family:var(--font-mono);transition:all .15s;margin-left:-2px}
.scene-btn:hover{background:var(--surface-hi);color:var(--text)}.scene-btn.active{background:rgba(184,134,11,.10);color:var(--amber)}
.scene-btn .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;opacity:.5}
.scene-btn.active .dot{opacity:1}
.scene-btn .slabel{font-size:11px;line-height:1.3;flex:1}.scene-btn .sdur{font-size:9px;color:var(--text-muted);margin-top:1px}
.sidebar-footer{margin-top:auto;padding:8px 12px;border-top:1px solid var(--border);font-size:9px;color:#252010}
#main{grid-area:main;overflow-y:auto;padding:20px 24px}
.panel{display:none;max-width:840px}.panel.active{display:block}
.scene-act{font-size:10px;letter-spacing:.18em;margin-bottom:6px;text-transform:uppercase}
.scene-title{font-family:var(--font-serif);font-size:22px;color:#e8e0c8;letter-spacing:.04em;margin-bottom:8px}
.scene-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.badge{font-size:10px;background:var(--surface-hi);border:1px solid var(--border-hi);border-radius:var(--r);padding:2px 8px;white-space:nowrap}
.badge.clue{color:#5a8a5a;background:#0a180a;border-color:#1a361a}.badge.san{color:#8a3a3a;background:#180a0a;border-color:#361a1a}
.badge.pass{color:#8a7a5a;background:#180e00;border-color:#362a00}
.read-aloud{background:var(--ra-bg);border:1px solid var(--ra-brd);border-left:4px solid var(--orange);border-radius:var(--r);padding:14px 18px;margin-bottom:18px}
.ra-label{font-size:9px;color:var(--orange);letter-spacing:.18em;font-weight:bold;margin-bottom:10px}
.ra-text{font-family:var(--font-serif);font-size:14px;color:var(--ra-txt);line-height:1.85;white-space:pre-line}
.content-block{background:var(--surface-hi);border:1px solid var(--border);border-radius:var(--r);padding:14px 18px;margin-bottom:18px}
.block-label{font-size:9px;color:var(--text-muted);letter-spacing:.15em;margin-bottom:10px;text-transform:uppercase}
.content-text{font-size:13px;color:var(--text-sub);line-height:1.9;white-space:pre-line}
.mech-table{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:18px}
.mech-hd{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr) minmax(0,2.5fr);background:var(--surface-top);padding:6px 12px;gap:12px;border-bottom:1px solid var(--border)}
.mech-hd div{font-size:9px;color:var(--text-muted);letter-spacing:.12em;text-transform:uppercase}
.mech-row{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr) minmax(0,2.5fr);padding:10px 12px;gap:12px;border-bottom:1px solid #161412}
.mech-row:last-child{border-bottom:none}.mech-row:nth-child(odd){background:var(--surface-hi)}.mech-row:nth-child(even){background:#110f0d}
.mech-skill{font-size:12px;color:#a080d0;line-height:1.4}.mech-diff{font-size:11px;line-height:1.4}
.mech-diff.hard{color:#c0782a}.mech-diff.auto{color:#6a9a6a}.mech-diff.normal{color:var(--text-muted)}
.mech-out{font-size:12px;color:var(--text-sub);line-height:1.5}
.san-block{border:1px solid #2a1818;border-radius:var(--r);overflow:hidden;margin-bottom:18px}
.san-row{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;gap:16px;border-bottom:1px solid #2a1818}
.san-row:last-child{border-bottom:none}.san-row:nth-child(odd){background:#120808}.san-row:nth-child(even){background:#150a0a}
.san-evt{font-size:12px;color:#a07878}.san-loss{font-size:12px;color:var(--red);font-family:var(--font-serif);font-weight:bold;white-space:nowrap}
.san-gain{font-size:12px;color:#4a9a4a;font-family:var(--font-serif);font-weight:bold;white-space:nowrap}
.clue-list{display:flex;flex-direction:column;gap:5px;margin-bottom:18px}
.clue-item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;background:var(--surface-hi);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;transition:all .15s}
.clue-item:hover{background:var(--surface-top)}.clue-item.done{background:#0c150c;border-color:#183018;opacity:.65}
.clue-chk{width:16px;height:16px;border:1px solid #3a3830;border-radius:2px;background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.clue-item.done .clue-chk{border-color:#4a8a4a;background:#183018}
.clue-name{font-size:12px;color:#8aba8a}.clue-item.done .clue-name{color:#5a7a5a;text-decoration:line-through}
.clue-handout{font-size:9px;color:#8a703a;background:#1a1000;border:1px solid #3a2a10;border-radius:2px;padding:1px 5px;margin-left:6px}
.clue-desc{font-size:11px;color:#555045;line-height:1.5;margin-top:2px}
.keeper-note{background:var(--keeper-bg);border:1px solid var(--keeper-brd);border-left:4px solid #2a6a2a;border-radius:var(--r);padding:12px 16px;margin-bottom:18px}
.kn-label{font-size:9px;color:#3a7a3a;letter-spacing:.15em;margin-bottom:7px;text-transform:uppercase}.kn-text{font-size:12px;color:var(--keeper-txt);line-height:1.7}
.scene-fnav{display:flex;gap:10px;margin-top:22px;padding-top:14px;border-top:1px solid var(--border)}
.fnav-btn{background:var(--surface-hi);border:1px solid var(--border-hi);border-radius:var(--r);color:var(--text-muted);cursor:pointer;padding:7px 14px;font-size:11px;font-family:var(--font-mono);transition:all .15s;white-space:nowrap}
.fnav-btn:hover{color:var(--text);border-color:#3a3830}.fnav-btn.next{color:var(--amber);border-color:var(--amber-dim)}.fnav-btn.next:hover{background:rgba(200,150,10,.1)}
.npc-card{background:var(--surface-hi);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.npc-card:hover{border-color:var(--border-hi)}.npc-card.open{border-color:#383430}
.npc-head{padding:12px 16px;display:flex;align-items:center;gap:12px}
.npc-name{font-family:var(--font-serif);font-size:15px;color:#e8e0c8}.npc-role{font-size:11px;color:var(--text-muted);margin-top:2px}
.npc-disp-tag{font-size:9px;border-radius:3px;padding:2px 8px;white-space:nowrap;border:1px solid}
.tag-ally{color:#4a8a5a;background:#0a180a;border-color:#1a3a1a}
.tag-neutral{color:#8a7a3a;background:#18140a;border-color:#36280a}
.tag-threat{color:#8a3a3a;background:#180a0a;border-color:#361a1a}
.tag-entity{color:#8a4a9a;background:#140a18;border-color:#2a1a3a}
.npc-chevron{color:var(--text-muted);font-size:13px;margin-left:auto;flex-shrink:0}
.npc-body{border-top:1px solid var(--border);padding:14px 16px;display:none}.npc-card.open .npc-body{display:block}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:600px){.two-col{grid-template-columns:1fr}}
.mini-label{font-size:9px;color:var(--text-muted);letter-spacing:.12em;margin-bottom:5px;text-transform:uppercase}.mini-text{font-size:12px;color:var(--text-sub);line-height:1.6}
.stat-pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.stat-pill{background:var(--surface-top);border:1px solid var(--border-hi);border-radius:3px;padding:4px 10px}
.stat-pill .sl{font-size:9px;color:var(--text-muted)}.stat-pill .sv{font-size:14px;color:#a080d0;font-weight:bold}
.inv-card{background:var(--surface-hi);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.inv-card:hover{border-color:var(--border-hi)}.inv-card.open{border-color:#383430}
.inv-head{padding:10px 16px;display:flex;align-items:center;gap:10px}
.inv-name{font-family:var(--font-serif);font-size:14px;color:#e8e0c8}
.inv-role-tag{font-size:10px;color:var(--text-muted);background:var(--surface-top);border:1px solid var(--border-hi);border-radius:2px;padding:1px 6px}
.inv-san-ctrl{display:flex;align-items:center;gap:4px;margin-left:auto;flex-shrink:0}
.san-lbl{font-size:9px;color:var(--text-muted);text-align:center;margin-bottom:3px}
.san-box{display:flex;align-items:center;gap:3px}
.san-mod{width:20px;height:20px;border:1px solid var(--border-hi);border-radius:2px;cursor:pointer;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);transition:all .15s}
.san-mod.minus{background:#180808;border-color:#361818;color:#c04444}.san-mod.plus{background:#081808;border-color:#183618;color:#44c044}
.san-mod:hover{opacity:.8}
.san-val{font-size:20px;font-family:var(--font-serif);font-weight:bold;min-width:32px;text-align:center;border:1px solid var(--border-hi);background:var(--surface-top);border-radius:3px;padding:0 4px}
.san-base{font-size:10px;color:var(--text-muted)}.inv-chevron{color:var(--text-muted);font-size:13px;flex-shrink:0;margin-left:4px}
.inv-body{border-top:1px solid var(--border);padding:14px 16px;display:none}.inv-card.open .inv-body{display:block}
.hook-box{font-size:11px;color:#7a8a7a;background:var(--keeper-bg);border:1px solid var(--keeper-brd);border-radius:3px;padding:8px 12px;margin-bottom:12px;line-height:1.6}
.hook-lbl{font-size:9px;color:#4a7a4a;letter-spacing:.12em;display:block;margin-bottom:4px;text-transform:uppercase}
.trigger-box{font-size:11px;color:#8a5a5a;background:#120808;border:1px solid #301818;border-radius:3px;padding:8px 12px;margin-top:8px;line-height:1.6}
.trig-lbl{font-size:9px;color:#7a3a3a;letter-spacing:.12em;display:block;margin-bottom:4px;text-transform:uppercase}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:12px}
.stat-cell{background:var(--surface-top);border:1px solid var(--border-hi);border-radius:3px;padding:5px 6px;text-align:center}
.stat-cell .sk{font-size:9px;color:var(--text-muted)}.stat-cell .sv{font-size:15px;color:var(--text);font-weight:bold}
.derived-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.der-pill{background:#0e100e;border:1px solid #1e301e;border-radius:3px;padding:3px 9px}
.der-k{font-size:9px;color:#4a7a4a}.der-v{font-size:13px;color:#6aaa6a;margin-left:4px}
.skills-text{font-size:11px;color:var(--text-muted);line-height:1.8;margin-bottom:8px}
.handout-list{display:flex;flex-direction:column;gap:5px;margin-bottom:20px}
.handout-list-lbl{font-size:9px;color:var(--text-muted);letter-spacing:.15em;margin-bottom:8px;text-transform:uppercase}
.hdoc-btn{background:var(--surface-hi);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;cursor:pointer;text-align:left;font-family:var(--font-mono);transition:all .15s;display:flex;align-items:center;gap:10px}
.hdoc-btn:hover{background:var(--surface-top);border-color:var(--border-hi)}.hdoc-btn.active{border-color:var(--amber-dim);background:rgba(184,134,11,.08)}
.hdoc-num{font-size:10px;color:var(--amber-dim);white-space:nowrap}.hdoc-name{font-size:12px;color:var(--text-sub)}
.handout-view{background:#100d08;border:1px solid #2e2618;border-radius:var(--r);padding:20px}
.hv-title{font-family:var(--font-serif);font-size:16px;color:#c8a840;margin-bottom:4px}
.hv-note{font-size:10px;color:var(--text-muted);margin-bottom:14px;font-style:italic}
.hv-paper{background:#1a1208;border:1px solid #3a2e18;border-radius:3px;padding:18px 20px}
.hv-text{font-family:var(--font-serif);font-size:13px;color:#c8b880;line-height:2;white-space:pre-line}
.clues-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
.clues-count{font-size:16px;font-family:var(--font-serif);color:var(--amber);white-space:nowrap;margin-top:4px}
.act-clue-group{margin-bottom:18px}
.act-clue-hd{font-size:10px;letter-spacing:.15em;text-transform:uppercase;padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid}
.reset-btn{background:var(--surface-hi);border:1px solid var(--border-hi);border-radius:var(--r);color:var(--text-muted);cursor:pointer;padding:6px 14px;font-size:10px;font-family:var(--font-mono);letter-spacing:.1em;transition:all .15s}
.reset-btn:hover{color:var(--text);border-color:#444}
.san-ref-table{border:1px solid #2a1818;border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.san-ref-hd{display:flex;justify-content:space-between;background:var(--surface-top);padding:6px 14px;border-bottom:1px solid #2a1818}
.san-ref-hd div{font-size:9px;color:var(--text-muted);letter-spacing:.12em;text-transform:uppercase}
.san-ref-row{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid #1e1212}
.san-ref-row:last-child{border-bottom:none}.san-ref-row:nth-child(odd){background:#120808}.san-ref-row:nth-child(even){background:#150a0a}
.san-ref-evt{font-size:12px;color:#a07878;flex:1}.san-ref-loss{font-size:12px;font-family:var(--font-serif);font-weight:bold;white-space:nowrap}
.inv-san-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:16px}
.inv-san-card{border-radius:var(--r);border:1px solid;padding:10px 12px;text-align:center}
.isc-name{font-family:var(--font-serif);font-size:12px;color:#e8e0c8;margin-bottom:6px}
.isc-ctrl{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:6px}
.isc-val{font-size:22px;font-family:var(--font-serif);font-weight:bold}
.isc-base{font-size:11px;color:var(--text-muted);font-family:var(--font-mono)}
.san-bar-wrap{height:4px;background:var(--surface);border-radius:2px;overflow:hidden}
.san-bar{height:100%;border-radius:2px;transition:width .3s}
.password-bar{background:var(--surface-hi);border:1px solid var(--amber-dim);border-radius:var(--r);padding:12px 16px;margin-bottom:18px;display:flex;align-items:center;gap:12px}
.pw-label{font-size:9px;color:var(--amber-dim);letter-spacing:.15em;text-transform:uppercase}
.pw-value{font-family:var(--font-serif);font-size:18px;color:var(--amber-hi);letter-spacing:.2em}
.clock-bar{background:var(--surface-hi);border:1px solid var(--act3-dim);border-radius:var(--r);padding:12px 16px;margin-bottom:18px;display:flex;align-items:center;gap:12px}
.ck-label{font-size:9px;color:#7a3030;letter-spacing:.15em;text-transform:uppercase}
.ck-time{font-family:var(--font-serif);font-size:18px;color:#cc3333;letter-spacing:.1em}
.ck-note{font-size:11px;color:var(--text-muted)}
</style>
</head>
<body>
<div id="app">
<div id="header">
  <div id="hdr-badge">EVENT 93 · CoC 7E · 1924</div>
  <div id="hdr-title">Not Another Telegram</div>
  <div id="hdr-spacer"></div>
  <div id="manifestation-bar">
    <div id="man-label">MANIFESTATION</div>
    <div id="man-pips"></div>
  </div>
  <div id="tab-bar">
    <button class="tab-btn" data-tab="scene">SCENE</button>
    <button class="tab-btn" data-tab="npcs">NPCs</button>
    <button class="tab-btn" data-tab="investigators">INVESTIGATORS</button>
    <button class="tab-btn" data-tab="handouts">HANDOUTS</button>
    <button class="tab-btn" data-tab="clues">CLUES</button>
    <button class="tab-btn" data-tab="san">SANITY</button>
  </div>
  <div id="hdr-nav">
    <button class="nav-arrow" id="btn-prev">◀ PREV</button>
    <button class="nav-arrow" id="btn-next">NEXT ▶</button>
  </div>
</div>
<div id="sidebar"></div>
<div id="main">
  <div class="panel" id="scene-panel"></div>
  <div class="panel" id="npcs-panel"></div>
  <div class="panel" id="investigators-panel"></div>
  <div class="panel" id="handouts-panel"></div>
  <div class="panel" id="clues-panel"></div>
  <div class="panel" id="san-panel"></div>
</div>
</div>

<script>
const ACT_COLORS={intro:"#b8860b",act1:"#7b52a8",act2:"#8b6030",act3:"#9a2020",epilogue:"#3a7a60"};

{id:"intro",act:"intro",actLabel:"INTRODUCTION",title:"Miss Pruitt's Office",duration:"15 min",
readAloud:`44 West 53rd Street, third floor. The office of Miss Hazel Pruitt, secretary to Professor Edna Whitmore.

A small, efficient room. Filing cabinets. The smell of cigarettes and strong tea. A window looking down onto the street. Miss Pruitt is a small, efficient woman in her fifties who smokes like a chimney and has the thousand-yard stare of someone who has worked for eccentric academics too long.

She hands each of you a carbon copy of the telegram and says:

"Professor Whitmore received this four days ago. She packed a bag and left immediately. She told me to contact everyone on the list if she hadn't returned by Friday. It is Friday."`,
content:`COMEDY BEAT: The telegram says "DO NOT COME TO THE BROWNSTONE." Pruitt informs them the Professor went directly to the brownstone. The Private Eye may observe this is, objectively, very stupid. This is the introduction to the self-aware tone.

SECOND NOTE: Whitmore left a sealed envelope marked "OPEN IF THINGS GO WRONG":
"If things go wrong, talk to Delia at the Blue Orchid. She'll know what Reggie was into."

BLUE ORCHID DETAILS:
• Basement speakeasy, 133rd Street, Harlem
• Entry through a laundry at the front
• Password this week: SASSAFRAS
• Opens at 9 PM — Delia Monroe is the lounge singer`,

keeperNote:`Miss Pruitt is not supernatural. She is just tired. She has seen too much without understanding any of it and she has made peace with that.

She will answer factual questions about Whitmore. She will not speculate. She will not panic. She will offer tea and look at the investigators with the patient exhaustion of someone who has been waiting for this conversation.

Set the tone here: dry, deadpan, slightly absurd. The horror has not arrived yet. This scene is a warm-up.`,

{id:"a1_orchid",act:"act1",actLabel:"ACT 1 — HOT JAZZ AND COLD LEADS",title:"1-1: The Blue Orchid",duration:"45 min",
readAloud:`133rd Street, Harlem. A basement club, warm as a held breath. Entry through a laundry at street level — the proprietor nods you down the stairs without looking up from his newspaper.

Then you hear it. The music arrives before the room does — a six-piece band playing something that makes your feet move before your brain approves. Amber light through cigarette haze. Round tables. Good whiskey in teacups. At the front, a woman in an emerald gown is singing something slow and precise, like she's nailing a butterfly to a board made of sound.

This is the last comfortable place you will be tonight.`,
content:`GETTING IN: Password is SASSAFRAS. State it to the man at the bottom of the stairs. He will nod.

FINDING DELIA: She's between sets. A successful Charm, Fast Talk, or Persuade roll gains her cooperation. Lucky (the Jazz Musician) gets an AUTOMATIC SUCCESS through his music-world connections. Intimidate closes her down entirely.

WHAT DELIA KNOWS:
1. Ashworth was hosting occult "salons" at his brownstone on East 64th Street
2. It started after he found something at an estate sale — a book wrapped in oilcloth
3. Three weeks ago, guests started disappearing after gatherings. One man found dead in his bathtub. Skin described as "curiously loose."
4. Ashworth became increasingly erratic — said: "It keeps looking at me from behind my own face."
5. Prof. Whitmore came three days ago asking the same questions. Delia told her to stay away from the brownstone. Whitmore thanked her and went.
6. (Secret — only if pressed deeply or on an Extreme success): Delia attended one early salon. Left after an hour because something felt wrong. Has never told anyone.

HANDOUT #1: The Newspaper Clipping — Delia gives this reluctantly from her handbag.`,

readAloud:`East 64th Street. A handsome four-storey townhouse. Beautiful, actually — the kind of building that expects things of you. Dark windows. A brass knocker in the shape of an eye, which you try very hard not to think about.

The front door is unlocked.

Inside: dust sheets over the furniture. Expensive portraits on the dark-panelled walls. The smell of old books and something underneath that — animal, somehow, and wrong.`,
content:`THE PORTRAITS: Spot Hidden to notice — in every portrait on the walls, the subject's face has been carefully cut out. Not torn — cut. Precisely. Each one: framed bodies in elegant clothes, oval voids where faces should be.

DOCTOR (Medicine or Spot Hidden): The cuts are surgical. Done with care.
ACADEMIC (History + Library Use): Recognises two of the empty frames — notable New York socialites, both reported missing in the papers recently.

COMEDY BEAT — DO NOT SKIP:
One of the portraits is of a dog. Its face has also been cut out. Nobody can explain why this is funnier and sadder than the human ones. The dog portrait will end up with Helen (the Reporter) at the end of this session. She cannot explain why she wants it. Just let it happen.

CLOCK: The grandfather clock in the corner reads 9:30 PM when investigators arrive. The pendulum is still swinging. Someone wound it recently.`,

{id:"a2_library",act:"act2",actLabel:"ACT 2 — THE BROWNSTONE",title:"2-2: The Library",duration:"25 min",
readAloud:null,
content:`FIRST FLOOR LIBRARY — The central investigation location. Allow 20-25 minutes here.

HANDOUT #2 — ASHWORTH'S JOURNAL: Leather-bound, on the desk. The first two-thirds are mundane ramblings — party invitations, opinions on wine, minor social grievances. Then, three months ago, the tone changes completely.

HANDOUT #3 — THE FACELESS CODEX: On a lectern, still wrapped in oilcloth. Small, bound in something that is not quite leather. Pages feel subtly wrong — slightly warm to the touch.

CODEX INVESTIGATION:
• Library Use (Academic or Doctor): Script resembles pre-Columbian Mesoamerican glyphic writing — centuries old at minimum. Not any known language.
• Anyone who studies it: SAN roll 1/1D6
  — Success: Understand nothing but feel profoundly watched
  — FAIL: Hear in the mind (not in any language): "The Face is a door. The door can be opened from either side."

This is the KEY to the banishment ritual. This is the sentence the Academic should write down.

MIDNIGHT DEADLINE: In the journal (Library Use, or simply reading it): Nov 29th entry mentions "The threshold is midnight — that is the only wall left between partial and full manifestation."

CURRENT TIME: Grandfather clock read 9:30 PM. It is now approximately 10:00 PM. Two hours remain.`,
mechanics:[
{skill:"Library Use (Academic / Doctor)",diff:"Normal",diffClass:"normal",outcome:"Script: pre-Columbian Mesoamerican glyphic writing. Centuries old. No known language."},
{skill:"Study the Codex — SAN roll",diff:"1/1D6",diffClass:"hard",outcome:"Success: feel profoundly watched. FAIL: hear in the mind: 'The Face is a door. The door can be opened from either side.'"},
{skill:"Library Use / Read journal",diff:"Normal",diffClass:"normal",outcome:"Find the midnight deadline entry. Nov 29: 'The threshold is midnight.'"}
],
keeperNote:`This is where the investigation narrows into dread. The journal starts as comedy (his opinions on wine are genuinely terrible) and then the entries from October onward are something else entirely.

READ THE JOURNAL ENTRIES SLOWLY. Each one is a step down. "Nothing happened that I could see" is scarier than anything explicit.

THE CODEX: The failure on the SAN roll produces a sentence in the investigator's mind. It is the key piece of information. Make sure whoever fails writes it down. It will matter in Act Three.

The Codex does not need to be read in full — it needs to be present and spoken from during the ritual. Whitmore will explain this in the basement.`,

{id:"a2_basement",act:"act2",actLabel:"ACT 2 — THE BROWNSTONE",title:"2-3: The Basement — Whitmore",duration:"20 min",
readAloud:`The basement stairs lead down to cold stone. A chalk circle on the floor, mostly smeared. Candles burned to nothing, some time ago. The smell of old fear, which is a real smell that you now know.

And in the centre: a wooden chair. And in the chair: a woman. Blindfolded. Earplugs inserted. Hands tied to the armrests — tied by herself, you realise, which must have taken some doing.

She is alive. Her breathing is rapid but controlled.

When you remove the blindfold, she grabs the nearest of you by the lapels and says, very quietly:

"Don't let it see your face."`,
content:`PROFESSOR EDNA WHITMORE — alive, 58, terrified, completely in command of her own terror.

She explains, in a fast, professorial rush:

1. THE WATCHER: A servitor entity — not a Great Old One, but a piece of one, sent ahead as a scout. Cannot exist fully in the physical world without a face. A human face worn like a mask feeds it enough energy to solidify.

2. ASHWORTH: Tried to close the ritual. He couldn't. He became its first face. The face you see on the Watcher is his.

3. THE CIRCLE: She was trying to complete the banishment circle when she heard the entity moving upstairs. She hid herself sensorily. She has been like this for approximately sixteen hours.

4. THE BANISHMENT REQUIRES THREE THINGS:
   • The Codex — they have it (it's on the lectern upstairs)
   • The original summoning point — this room
   • One investigator must stand before the entity, holding a mirror, and not look away while the others read the incantation

THE HERALD RETURNS:
As this conversation ends — a sound from upstairs. A vase breaking. Then footsteps on the stairs.

DARK COMEDY BEAT: The Herald knocked over the vase. He apologises, reflexively, as he descends the stairs. He is still, somewhere inside, Mr. Charles Henderson, 44, insurance clerk. His face moves slightly too much. His eyes belong to someone else.

The investigators will laugh nervously. Then they will feel terrible. That is correct.`,
mechanics:[
{skill:"Psychology",diff:"Normal",diffClass:"normal",outcome:"Something human is straining underneath the wrongness of the Herald. It is struggling."},
{skill:"Herald — Stare attack",diff:"POW vs POW",diffClass:"hard",outcome:"On fail: SAN 0/1D3. The Herald is measuring the nearest investigator's face."},
{skill:"Herald speaks with Ashworth's voice",diff:"Automatic trigger",diffClass:"auto",outcome:"SAN 0/1D4 for investigators who react. He says things only Ashworth would know. He may be begging for help."}
],
keeperNote:`WHITMORE'S VOICE: She is brilliant, guilty, and precise. She has been sitting in that chair for sixteen hours and she is still the most organised person in the room. Her terror does not make her less competent. It makes her more so.

Quote, if useful: "I knew he was dabbling. I thought he was simply too stupid to do any real damage. I was half right."

THE HERALD: This is the dark comedy beat turning sincere. The vase shattering and the reflexive apology should be funny. The face that moves wrong and the eyes that belong to someone else should be not-funny. Let that transition happen in real time.

HENDERSON'S DETAILS for Keeper only: Mr. Charles Henderson, 44, insurance clerk. Wife: Margaret. He attended Ashworth's final salon because Ashworth owed him money and the party seemed a good opportunity to raise the subject. He had no idea what he was walking into.

The best resolution for the Herald is not combat. Prepare for Act Three.`,

{id:"a3_circle",act:"act3",actLabel:"ACT 3 — THE WATCHER IN THE GLASS",title:"3-1: Completing the Circle",duration:"20 min",
readAloud:null,
content:`WHITMORE NEEDS HELP to restore the chalk ritual circle. It was smeared when she dove for the chair. It needs to be right.

TASKS:
1. UNDERSTAND THE PATTERN — Occult roll (Normal)
   • Success: Investigator knows what's needed and can guide the drawing
   • Fail: Whitmore can guide, but it costs 5 minutes

2. DRAW THE CIRCLE — Art/Craft (Drawing) or DEX roll (Normal)
   • Success: Clean and correct
   • Fail: One section must be redrawn — costs 5 minutes + SAN 0/1

3. HOLD OFF THE HERALD — Combat, Persuade, or positioning
   • He will try to disrupt the work
   • Every round he disrupts adds 1D3 rounds to the incantation

HERALD COMPLICATION:
The Herald is drawn to the circle being completed. One group works on the floor. Others manage the creature.

SANITY PRESSURE — ASHWORTH'S VOICE:
The Herald can speak with Ashworth's voice from behind the wrong face. Any investigator who reacts: SAN 0/1D4. He says things only Ashworth would know. He begs for help. He may be genuinely in there.

CURRENT TIME: Approximately 11:00 PM. One hour to midnight.
TENSION: Every wasted minute costs them.`,
mechanics:[
{skill:"Occult",diff:"Normal",diffClass:"normal",outcome:"Understands the pattern. Can guide the redrawing correctly."},
{skill:"Art/Craft (Drawing) or DEX",diff:"Normal",diffClass:"normal",outcome:"Success: circle is correct. Fail: redraw needed, +5 min, SAN 0/1."},
{skill:"Persuade / Psychology (Herald)",diff:"Hard",diffClass:"hard",outcome:"Can feel Henderson straining against the thing controlling him. He can be reached — but not yet. Save it for the end."},
{skill:"Fighting (Brawl) vs Herald",diff:"Normal",diffClass:"normal",outcome:"Herald: Fighting 45%, HP 12, DB +1D4. Can be physically restrained but not killed — Henderson's body will not stop."}
],
keeperNote:`Keep this tense and moving. Two simultaneous things happening: the circle being drawn, the Herald being managed.

If players are stuck on how to manage the Herald: remind them that Whitmore said the resolution is the ritual. The Herald cannot be permanently stopped by violence. He can be restrained, distracted, avoided. The circle is the priority.

DO NOT LET THE HERALD KILL ANYONE. He is threatening but not lethally efficient. He grapples. He stares. He speaks. He is not a killer — Henderson never was.

PACING NOTE: If this scene is running long, cut it. Move to 3-2. The time pressure is real. The Watcher arriving slightly before the circle is complete is actually more dramatic.`,
clueIds:[],sanEvents:[{evt:"Herald speaks with Ashworth's voice — for any investigator who reacts",loss:"0/1D4",lvl:2}]},

{id:"a3_watcher",act:"act3",actLabel:"ACT 3 — THE WATCHER IN THE GLASS",title:"3-2: The Watcher Arrives",duration:"35 min",
readAloud:`The temperature drops first — not to cold, but to wrong. The shadows in the corner of the room stop behaving.

Then you see it, and your brain performs a small, polite act of mercy by refusing to fully process what it is.

It is tall. It is not quite standing. It has faces — several of them, worn one atop the other like pages in a book. The outermost is recent. You recognise it as Reginald Ashworth from his newspaper photograph. He is smiling. He has always been smiling. He was smiling before his face was removed.

The thing beneath the faces has no features of its own. That is the worst part. It is looking at you with nothing. And you feel, with horrible certainty, that it is measuring your face.

Checking the fit.`,
content:`THE THREE PHASES:

━━━ PHASE 1: THE OFFERING OF REFLECTION ━━━
One investigator must volunteer to hold the gilt-framed oval mirror from the wall, stand before the Watcher, and not look away.

• SAN roll: 1D6/1D20
• HOLD: Watcher sees itself reflected — no face. It is transfixed. Paralysed for the duration of the incantation.
• LOOK AWAY: Watcher lunges. Face Peel attack.

BEST CANDIDATES (structurally): Vivienne St. Claire (the Heiress — social courage at its limit) or Walter Finch (the Academic — intellectual reckoning made physical). But any investigator can step up.

IF NO ONE VOLUNTEERS: Whitmore does it herself. She must make a HARD SAN roll. If she fails, the paralysis breaks early — the Watcher can act for 1D3 rounds before someone picks up the mirror.

KEEPER NOTE: Pause here. Give whoever volunteers a moment of weight. The other players should be watching. This is the scenario's central heroic moment.

━━━ PHASE 2: THE INCANTATION ━━━
Whitmore leads three investigators reading from the Codex.
THREE CONSECUTIVE OCCULT ROLLS — recommended difficulty: Hard.

• Failed roll: SAN 1/1D4 — the words do things to the reader's mouth that words should not do. But the ritual continues.
• Critical success: No SAN cost for that reader; next roll's difficulty reduced by one level.

READ ALOUD AS INCANTATION BEGINS:
"Whatever face it wears, it is not the face. Whatever door it opens, the door opens from both sides. We name ourselves. We claim the threshold. We give it nothing. We give it nothing. We give it nothing."

(The words should not make the investigators feel powerful. They should feel like standing very still while something enormous passes.)

━━━ PHASE 3: HENDERSON'S CHOICE ━━━
As the ritual nears completion, the Herald becomes lucid for a final moment.

Psychology or Persuade roll — or simply speak to him. Really speak to Henderson, not the monster.

"Tell my wife the cat needs feeding on Thursdays. She always forgets."

Then the ritual completes.

━━━ THE BANISHMENT ━━━
The Watcher collapses inward. Not violently — it simply stops fitting in the physical world and falls through the floor like water through paper. The faces scatter. Ashworth's face, last of all, settles face-down on the chalk circle.

The Herald's body crumples.

The candles relight themselves. Then immediately go out.

Silence.

WHITMORE: "Well. That was about what I expected."`,
mechanics:[
{skill:"SAN roll — holding the mirror",diff:"1D6/1D20",diffClass:"hard",outcome:"Hold: Watcher paralysed. Look away: Face Peel attack begins."},
{skill:"Occult — incantation (×3, consecutive)",diff:"Hard",diffClass:"hard",outcome:"Success: ritual progresses. Fail: SAN 1/1D4, words do things to the mouth. Ritual still continues."},
{skill:"Watcher — Face Peel (if paralysis breaks)",diff:"Fighting 65% vs STR",diffClass:"hard",outcome:"1D6 damage + 1D6 SAN per round until broken free (opposed STR)."},
{skill:"Persuade / Psychology (Henderson)",diff:"Normal or roleplay",diffClass:"normal",outcome:"Henderson goes lucid. He stays still. He says his line. The ritual completes."}
],
keeperNote:`DO NOT DESCRIBE THE WATCHER AT LENGTH.

The read-aloud gives the shape of it. That is enough. The investigators have been building toward this all night — the accumulated dread is doing most of the work. One description. No embellishment after that.

THE MIRROR MOMENT: This is the emotional peak of Act Three. Whoever volunteers — pause. Make them stand up from the table if they want to. Let the other players look at them. The heroism here should feel earned and real and costly.

HENDERSON'S LAST LINE: Do not rush past it. Let it land. Pause afterward. Let there be silence at the table. This is the moment the scenario has been building to since the vase on the stairs.

"Tell my wife the cat needs feeding on Thursdays. She always forgets."

AFTER: Whitmore's line ("Well. That was about what I expected.") is the exhale. Someone will laugh. Someone might cry. Both are correct.

━━━ IF MIDNIGHT ARRIVES (FAILURE STATE) ━━━
The Watcher fully manifests. Mirror aversion fails. The circle is meaningless.

READ ALOUD (failure):
"The grandfather clock above strikes twelve. You feel it as a shift — a door opening somewhere deeper than the basement floor. The Watcher makes a sound. It is not a sound that belongs to any face. Something in its posture changes. It has been looking for faces. It stops looking. It begins taking."

This is total failure. Investigators who flee immediately survive. Those who don't suffer Face Peel. End on the final telegram ("INTERESTING STOP WILL BE WATCHING STOP. There are others.") and close there.

NOTE: This should be rare. The scenario is generous with information. If it happens, honour it — don't soften it.

━━━ IF INVESTIGATORS TRY TO DESTROY THE CODEX ━━━
Whitmore stops them: "You cannot burn it. I tried. The paper doesn't catch. Whatever it's bound in doesn't burn. Believe me, I would have done it by now."
If they attempt destruction mid-incantation: ritual disrupted, Watcher freed early, circle must be re-established. SAN 0/1D6 per investigator present.`,
clueIds:[],sanEvents:[{evt:"First sight of the Skinless Watcher",loss:"1D3/1D10",lvl:4},{evt:"Holding the mirror — volunteer",loss:"1D6/1D20",lvl:5},{evt:"Failed Occult roll during incantation",loss:"1/1D4",lvl:3},{evt:"Face Peel attack — per round",loss:"1D6+1D6 SAN",lvl:4},{evt:"Henderson's final words",loss:"0/1D3",lvl:2},{evt:"Banishment succeeds",loss:"+1D6 SAN (GAIN)",lvl:1}]},

{id:"epilogue",act:"epilogue",actLabel:"EPILOGUE",title:"The Morning After",duration:"15 min",
readAloud:null,
content:`Address each investigator personally. Close their hooks. Do not rush this. It is fifteen minutes of earned space after everything the night took from these characters.

SUGGESTED OUTCOMES:

WHITMORE — Recovers. Publishes nothing. Retires to a cottage in Vermont. Begins keeping a very large number of cats. When asked about the cats, says only that she finds them "appropriately suspicious."

DELIA MONROE — Hears nothing more from the investigators and considers this a good sign. Plays the Blue Orchid for another decade. The emerald earrings are never explained.

MISS PRUITT — Receives a telegram from Whitmore two days later: "Safe. Catalogue destroyed." Files it. Makes tea. Does not open it for three days.

THE CODEX:
• Destroyed — recommended
• Locked away — dangerous
• Studied further — extremely dangerous and irresponsible, which is exactly what at least one investigator will want to do

THE DOG PORTRAIT — Quietly kept by Helen (the Reporter). She cannot explain why she wanted it. She keeps it face-out on her mantelpiece.

HENDERSON — His wife, Margaret, feeds the cat on Thursdays now. She does not know why she started. The cat is named Gerald. Gerald seems fine.

━━━━━━━━━━━━━━━━━━━━━━━━━━

FINAL OPTIONAL BEAT:

One week later, each investigator receives a telegram. Unknown sender. The telegram boy cannot describe who sent it.

Read this slowly. Do not explain it. End here.

"INTERESTING STOP WILL BE WATCHING STOP"

That's it. No return address. No explanation. End of scenario.`,
mechanics:[],
keeperNote:`Spend a sentence on each investigator's personal hook. Not just what happens to them — what they feel about what happened.

Helen: Did she file the story? If she did, what was it about? If she didn't, why not? What does it mean to have a story you can't tell?

Mickey: The surveillance photo he burned. He still wakes up at 3am. Is that going to stop now? He doesn't know.

The Doctor: He examined one of Ashworth's early victims. Something about the skin, he said. He knows what that was now. Does that make it better?

Lucky: He was right about the music. The wrong note was real. What does he do with that knowledge every time he picks up his trumpet?

Vivienne: The dreams. Are they gone? She will not know for some time.

Finch: He recognised the symbols in Whitmore's letter. He has Cthulhu Mythos 20%. He knows more than he should. That number goes up.

THE FINAL TELEGRAM: Put it down on the table if you can. Actually print it. Let the players read it. End there. Don't say anything else.`,
clueIds:[],sanEvents:[]}
];

{id:"h2",num:"02",title:"Ashworth's Journal — Selected Pages",note:"Leather-bound. Found on the library desk. First two-thirds: mundane. Read these entries slowly.",
text:`Oct 4th — The book arrived today. I am not sure
what language it is. I am not sure it is a language.

Oct 19th — I read aloud from page 47. Nothing
happened. Or rather, nothing happened that I
could see.

Nov 2nd — There is something behind my reflection
now. Not in the mirror. Behind it. In the space
where the reflection lives.

Nov 14th — The salons are going splendidly.
Everyone is fascinated. I am beginning to
understand why it wants faces.

Nov 29th — I think I invited it in. I cannot close
the door. The threshold is midnight — that is the
only wall left between partial and full
manifestation. After that, I don't believe the
ritual circle will hold it at all. I have written
to Edna. I hope she does not come here.

[Final entry — four days ago, handwriting ragged:]

IT IS WEARING HENDERSON NOW.
HENDERSON VISITED TUESDAY.

I AM SO SORRY.`},

{id:"h3",num:"03",title:"The Faceless Codex — Whitmore's Translation",note:"Physical prop: hand the player an actual blank book wrapped in oilcloth. Do not open it before the scene.",
text:`[From Professor E. Whitmore's partial translation
of the text she calls the Faceless Codex]

Script: related to pre-Columbian Mesoamerican
glyphic tradition. Age: centuries minimum.

What I have been able to translate:

"The Face is a door.
 The door can be opened from either side."

"Whatever name the Watcher wears, it is not
 the name. A mirror shows no name.
 A mirror shows only the absence."

"The ritual of reflection closes the door
 from this side. Three voices. Three readings.
 One who does not look away."

[Note in Whitmore's handwriting:]
The incantation: repeat this until the
entity collapses:

"Whatever face it wears, it is not the face.
 Whatever door it opens, the door opens
 from both sides.
 We name ourselves. We claim the threshold.
 We give it nothing. We give it nothing.
 We give it nothing."`},

{id:"h4",num:"04",title:"The Original Telegram",note:"Print on period paper if possible. Western Union format. This is what started everything.",
text:`WESTERN UNION TELEGRAM

TO:   PROFESSOR EDNA WHITMORE
      44 WEST 53 ST NEW YORK CITY

FROM: R. ASHWORTH

EDNA STOP THE WHEEL IS TURNING STOP
DO NOT COME TO THE BROWNSTONE STOP
THE SKIN DOES NOT FIT ANYMORE STOP

REGINALD STOP`}
];

// Manifestation pips
function buildManifestPips(){
  const c=$("man-pips");c.innerHTML="";
  for(let i=1;i<=5;i++){
    const d=document.createElement("div");
    d.className="man-pip"+(i<=manifestLevel?" filled":"");
    d.title=`Level ${i}`;
    d.onclick=()=>{manifestLevel=i;buildManifestPips();};
    c.appendChild(d);
  }
}

function buildSidebar(){
  const s=$("sidebar");
  let h="";
  ACT_ORDER.forEach(act=>{
    const sc=SCENES.filter(s=>s.act===act);
    if(!sc.length)return;
    const color=ACT_COLORS[act];
    h+=`<div class="act-block"><div class="act-label-hd">${ACT_LABELS[act]}</div>`;
    sc.forEach(scene=>{
      const active=scene.id===currentScene.id;
      h+=`<button class="scene-btn${active?" active":""}" onclick="currentScene=SCENES.find(s=>s.id==='${scene.id}');activeTab='scene';renderAll()" style="${active?`border-left-color:${color};color:${color}`:""}">
        <div class="dot"></div>
        <div><span class="slabel">${scene.title}</span><div class="sdur">${scene.duration}</div></div>
      </button>`;
    });
    h+=`</div>`;
  });
  h+=`<div class="sidebar-footer">CoC 7E · NYC 1924 · Midnight deadline</div>`;
  s.innerHTML=h;
}

function buildScenePanel(){
  const sc=currentScene;const color=ACT_COLORS[sc.act];const dimColor=ACT_DIM[sc.act];
  let h=`<div class="scene-act" style="color:${color}">${sc.actLabel}</div>`;
  h+=`<div class="scene-title">${sc.title}</div>`;
  h+=`<div class="scene-meta"><span class="badge">${sc.duration}</span>`;
  if(sc.clueIds.length)sc.clueIds.forEach(id=>{const c=CLUES.find(x=>x.id===id);if(c)h+=`<span class="badge clue">CLUE: ${c.label}</span>`;});
  if(sc.sanEvents.length)sc.sanEvents.forEach(s=>h+=`<span class="badge san">SAN: ${s.loss}</span>`);
  if(sc.id==="a1_orchid")h+=`<span class="badge pass">PASSWORD: SASSAFRAS</span>`;
  h+=`</div>`;

  if(sc.id==="a3_watcher"||sc.id==="a3_circle"){
    h+=`<div class="clock-bar"><div class="ck-label">MIDNIGHT DEADLINE</div><div class="ck-time">~11:00 PM</div><div class="ck-note">Increase manifestation pip as tension builds</div></div>`;
  }

  if(sc.readAloud){
    h+=`<div class="read-aloud"><div class="ra-label">READ ALOUD</div><div class="ra-text">${sc.readAloud}</div></div>`;
  }
  if(sc.content){
    h+=`<div class="content-block"><div class="block-label">KEEPER NOTES — SCENE CONTENT</div><div class="content-text">${sc.content}</div></div>`;
  }
  if(sc.mechanics.length){
    h+=`<div class="mech-table"><div class="mech-hd"><div>SKILL / ACTION</div><div>DIFFICULTY</div><div>OUTCOME</div></div>`;
    sc.mechanics.forEach(m=>h+=`<div class="mech-row"><div class="mech-skill">${m.skill}</div><div class="mech-diff ${m.diffClass}">${m.diff}</div><div class="mech-out">${m.outcome}</div></div>`);
    h+=`</div>`;
  }
  if(sc.sanEvents.length){
    h+=`<div class="san-block">`;
    sc.sanEvents.forEach(s=>h+=`<div class="san-row"><div class="san-evt">${s.evt}</div><div class="${s.lvl===0?"san-gain":"san-loss"}">${s.loss}</div></div>`);
    h+=`</div>`;
  }
  if(sc.keeperNote){
    h+=`<div class="keeper-note"><div class="kn-label">KEEPER NOTE</div><div class="kn-text">${sc.keeperNote}</div></div>`;
  }

  const idx=SCENES.findIndex(s=>s.id===sc.id);
  const prev=SCENES[idx-1],next=SCENES[idx+1];
  if(prev||next){
    h+=`<div class="scene-fnav">`;
    if(prev)h+=`<button class="fnav-btn" onclick="currentScene=SCENES[${idx-1}];renderAll()">← ${prev.title}</button>`;
    if(next)h+=`<button class="fnav-btn next" onclick="currentScene=SCENES[${idx+1}];renderAll()">${next.title} →</button>`;
    h+=`</div>`;
  }
  $("scene-panel").innerHTML=h;
}

    h+=`</div>`;
  });
  h+=`<button class="reset-btn" onclick="checkedClues={};renderAll()">RESET ALL CLUES</button>`;
  $("clues-panel").innerHTML=h;
}

function buildSanPanel(){
  let h=`<div style="font-family:var(--font-serif);font-size:16px;color:#e8e0c8;margin-bottom:4px">Sanity Reference</div><div style="font-size:11px;color:var(--text-muted);margin-bottom:18px">Costs by event. Track per investigator below.</div>`;
  h+=`<div class="san-ref-table"><div class="san-ref-hd"><div>Event</div><div>Loss / Gain</div></div>`;
  SAN_TABLE.forEach(row=>{
    const isGain=row.loss.startsWith("+");
    h+=`<div class="san-ref-row"><div class="san-ref-evt">${row.evt}</div><div class="san-ref-loss" style="color:${isGain?"#4a9a4a":SAN_COLORS[Math.min(row.lvl,5)]}">${row.loss}</div></div>`;
  });
  h+=`</div><div style="font-family:var(--font-serif);font-size:15px;color:#e8e0c8;margin-bottom:12px">Current SAN by Investigator</div><div class="inv-san-grid">`;
  INVESTIGATORS.forEach(inv=>{
    const cur=sanValues[inv.id]||0,pct=(cur/inv.derived.SAN)*100;
    const sanCol=pct>70?"#4a9a4a":pct>40?"#9a7a20":pct>20?"#9a4a20":"#c02020";
    const bgCol=pct>70?"#0a160a":pct>40?"#160e00":pct>20?"#160800":"#190808";
    h+=`<div class="inv-san-card" style="background:${bgCol};border-color:${sanCol}33"><div class="isc-name">${inv.name}</div><div class="isc-ctrl"><button class="san-mod minus" onclick="sanValues['${inv.id}']=Math.max(0,(sanValues['${inv.id}']||0)-1);renderAll()">−</button><div class="isc-val" style="color:${sanCol}">${cur}<span class="isc-base">/${inv.derived.SAN}</span></div><button class="san-mod plus" onclick="sanValues['${inv.id}']=Math.min(99,(sanValues['${inv.id}']||0)+1);renderAll()">+</button></div><div class="san-bar-wrap"><div class="san-bar" style="width:${Math.min(100,pct)}%;background:${sanCol}"></div></div></div>`;
  });
  h+=`</div><button class="reset-btn" style="margin-top:12px" onclick="INVESTIGATORS.forEach(i=>sanValues[i.id]=i.derived.SAN);renderAll()">RESET ALL SAN</button>`;
  $("san-panel").innerHTML=h;
}

function renderAll(){
  buildSidebar();
  const idx=SCENES.findIndex(s=>s.id===currentScene.id),prev=SCENES[idx-1],next=SCENES[idx+1];
  $("btn-prev").disabled=!prev;$("btn-prev").style.opacity=prev?"1":"0.3";
  $("btn-next").disabled=!next;$("btn-next").style.opacity=next?"1":"0.3";
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  const tabEl=$(activeTab+"-panel")||$("scene-panel");
  tabEl.classList.add("active");
  const color=ACT_COLORS[currentScene.act];
  document.querySelectorAll(".tab-btn").forEach(b=>{
    b.classList.toggle("active",b.dataset.tab===activeTab);
    b.style.borderBottomColor=b.dataset.tab===activeTab?color:"transparent";
    b.style.color=b.dataset.tab===activeTab?color:"";
  });
  if(activeTab==="scene")buildScenePanel();
  else if(activeTab==="npcs")buildNpcPanel();
  else if(activeTab==="investigators")buildInvPanel();
  else if(activeTab==="handouts")buildHandoutsPanel();
  else if(activeTab==="clues")buildCluesPanel();
  else if(activeTab==="san")buildSanPanel();
  const m=$("main");if(m)m.scrollTop=0;
}

function toggleClue(id){checkedClues[id]=!checkedClues[id];}
document.querySelectorAll(".tab-btn").forEach(btn=>btn.addEventListener("click",()=>{activeTab=btn.dataset.tab;renderAll();}));
$("btn-prev").addEventListener("click",()=>{const i=SCENES.findIndex(s=>s.id===currentScene.id);if(i>0){currentScene=SCENES[i-1];renderAll();}});
$("btn-next").addEventListener("click",()=>{const i=SCENES.findIndex(s=>s.id===currentScene.id);if(i<SCENES.length-1){currentScene=SCENES[i+1];renderAll();}});
renderAll();
</script>
</body>
</html>
