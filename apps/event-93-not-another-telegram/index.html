<script>
const PLAYERS=[
  {seat:"1",name:"Mateusz Sawicki"},
  {seat:"2",name:"Alex Walker"},
  {seat:"3",name:"Kim De Bruyn"},
  {seat:"4",name:"Wim Van Hove"},
  {seat:"5",name:"Michail Mandilaras"},
  {seat:"6",name:"Andrew Mazibrada"}
];
const ACT_COLORS={intro:"#c8860a",act1:"#c93535",act2:"#4a7ab8",act3:"#8b3fa0",epilogue:"#5a8a5a"};
const SAN_COLORS=["","#6b8a6b","#8a8a4a","#a07030","#c03030","#e01010"];

const SCENES=[
{id:"intro",act:"intro",actLabel:"INTRODUCTION",title:"Miss Pruitt's Office",duration:"15 min",
readAloud:`44 West 53rd Street, 3rd Floor. Friday afternoon.

Miss Hazel Pruitt is a small, efficient woman in her fifties who smokes like a chimney and has the thousand-yard stare of someone who has worked for eccentric academics far too long. She hands each of you a carbon copy of the same telegram and says:

"Professor Whitmore received this four days ago. She packed a bag and left immediately. She told me to 'contact everyone on the list' if she hadn't returned by Friday."

She pauses to light another cigarette from the butt of the last.

"It is Friday."`,
content:`THE TELEGRAM:
"EDNA STOP THE WHEEL IS TURNING STOP DO NOT COME TO THE BROWNSTONE STOP THE SKIN DOES NOT FIT ANYMORE STOP REGINALD STOP"

COMEDY BEAT: The investigators will notice the telegram says DO NOT COME TO THE BROWNSTONE. Invite someone to point this out. Miss Pruitt confirms Whitmore went directly there. Mickey (PI) may note this is objectively very stupid. Let this land before moving on.

SECOND NOTE — Whitmore's sealed envelope: "OPEN IF THINGS GO WRONG."
Contents: "If things go wrong, talk to Delia at the Blue Orchid. She'll know what Reggie was into."

THE BLUE ORCHID: Basement speakeasy, 133rd Street, Harlem. Entry through a laundry. Password this week: "Sassafras." Open from 9 PM.

OPTIONAL — CLARENCE FITCH (building bellhop): Has delivered enough strange missives for eccentric academics that he mutters "Oh, not another one of those" when handling the telegrams. Very funny. Use if the table is warm.

TIME: It is approximately 8:00 PM. Midnight is four hours away.`,
mechanics:[
{skill:"Fast Talk / Charm (Miss Pruitt)",diff:"Automatic",diffClass:"auto",outcome:"She shares everything willingly. She is not obstructing. She is tired."},
{skill:"Spot Hidden (office desk)",diff:"Normal",diffClass:"normal",outcome:"A folded newspaper from three days ago — Ashworth's society-page obituary circled in pencil. She gives it on request."}
],
keeperNote:"Keep this brisk — 15 minutes. The comedy is in Miss Pruitt's exhausted normalcy. Don't let investigators spend time investigating the office. There's nothing here. The scenario is out there. Let them go.\n\nKey quote: 'I don't ask what the books are about. I just catalogue them.'\n\nIF INVESTIGATORS SKIP THE BLUE ORCHID: They miss Delia's briefing (recoverable from Whitmore), the newspaper clipping (findable in Ashworth's library), and Lucky's automatic rapport with the music world. What is irreplaceable: the warm scene before things go dark, and the tonal contrast it creates. The Herald still appears. The scenario is survivable without Act One. It loses its texture.",
clueIds:["telegram","newspaper"],sanEvents:[]},

{id:"a1_blueorchid",act:"act1",actLabel:"ACT ONE — HOT JAZZ AND COLD LEADS",title:"The Blue Orchid Jazz Club",duration:"45 min",
readAloud:`The Blue Orchid is everything the city should be and mostly isn't — warm amber light, cigarette smoke thick as good wool, a six-piece band playing something that makes your feet move before your brain approves. The walls are close. The tables are closer. Everyone here is very beautiful and very tired.

Delia Monroe is at the microphone, and the room belongs entirely to her.`,
content:`ATMOSPHERE: Spend two minutes here. This is the last comfortable place the investigators will be. Let them feel the warmth. It makes what follows colder.

PASSWORD: "Sassafras." The man at the laundry entrance repeats it questioningly, with mild contempt. This is the correct response.

GETTING DELIA TO TALK:
• Charm / Persuade / Fast Talk — Normal difficulty
• Intimidate — closes her completely. She has handled worse.
• Lucky (Jazz Musician) — Automatic success through music connections

WHAT DELIA KNOWS (release in order):
1. Ashworth hosted occult "salons" at his brownstone, East 64th Street
2. Started after he found something at an estate sale — a book wrapped in oilcloth
3. Three weeks ago, guests started disappearing. One found dead in his bathtub; skin "curiously loose"
4. Ashworth became erratic: "It keeps looking at me from behind my own face"
5. Whitmore came three days ago with the same questions. Delia told her to stay away. Whitmore thanked her and went.
[Secret: Delia attended one early salon. Left within the hour. Felt something wrong. Has told no one.]

→ HANDOUT #1: Newspaper clipping, given after trust established.

THE WRONG NOTE:
As investigators prepare to leave, the band stumbles — one odd, wrong note.
• Lucky (Music roll): Recognises it was intentional. A signal.
• Any investigator (Spot Hidden): Thin man, grey suit, near the bar. Leaves before approach. His face moves slightly wrong from this distance.
This is the Herald (Henderson). He reappears at the Brownstone.`,
mechanics:[
{skill:"Charm / Persuade / Fast Talk (Delia)",diff:"Normal",diffClass:"normal",outcome:"She talks. Releases information above in order. Gives newspaper clipping."},
{skill:"Intimidate (Delia)",diff:"—",diffClass:"hard",outcome:"She stops talking entirely and asks you to leave. The bouncer is large."},
{skill:"Music (Lucky — the wrong note)",diff:"Normal",diffClass:"normal",outcome:"The note was intentional. Someone in the club is signalling. They are watching."},
{skill:"Spot Hidden (the Herald)",diff:"Normal",diffClass:"normal",outcome:"Thin man, grey suit. Leaves before approach. Face moves slightly wrong at this distance."}
],
keeperNote:"The Blue Orchid is warm and wonderful and Delia is the most competent person in the scenario. Let investigators enjoy her. Do not rush this scene.\n\nIf the table is doing well on time: let Lucky play a set with the house band. Costs five minutes. Worth it for Lucky's player and for establishing what the scenario takes away.\n\nKey line for Delia: 'I told the Professor to stay away from the brownstone. She thanked me and went. That's the thing about Whitmore — she's always very polite before she does something completely insane.'",
clueIds:["newspaper","herald_glimpse"],sanEvents:[]},

{id:"a2_drawing",act:"act2",actLabel:"ACT TWO — THE BROWNSTONE",title:"2-1: The Drawing Room",duration:"15 min",
readAloud:`A handsome four-storey townhouse on East 64th Street. Dark windows. A brass knocker in the shape of an eye. The front door is unlocked.

You step into the drawing room. Dust sheets over the furniture. Oil portraits in heavy gilded frames on the dark walls — the portraits of a man who wanted to be taken seriously. In each one, where the subject's face should be, there is simply a hole. A precise, oval excision. The body remains, elegantly dressed, caught mid-gesture for eternity.

The face is gone.

There are eleven of them.`,
content:`PORTRAIT EXAMINATION:
• Doctor (Medicine): The cuts are surgical. Done with precision instruments. Took time. Done by someone who knew exactly what they were removing.
• Academic (History/Library Use): Two frames contain identifiable figures — notable New York socialites. Both recently reported missing in the papers.
• Any investigator (Spot Hidden): The cuts are not torn or burned. They are cut with care.

COMEDY BEAT — DO NOT SKIP:
One portrait is of a dog. A fine dog, clearly beloved, expensively painted. Its face has also been cut out.
Nobody can explain why this is funnier and sadder than the human ones.
[The dog portrait goes home with Helen at the end. She cannot explain this either.]

THE GRANDFATHER CLOCK: In the corner. Note the time aloud — approximately 9:30 PM when investigators arrive. It ticks. The deadline is present. It is patient. Mention it occasionally through Act Two.

THE DOOR WITH NO FACE: One final portrait near the library stairs — the largest frame in the room — is empty. The mounting hooks are fresh. Whatever was here was removed recently. Not cut. Taken down.`,
mechanics:[
{skill:"Medicine (Doctor, portrait cuts)",diff:"Normal",diffClass:"normal",outcome:"Surgical instruments. Deliberate removal. Someone who knew what they were doing."},
{skill:"History / Library Use (Academic)",diff:"Normal",diffClass:"normal",outcome:"Two identifiable missing socialites. Were either of them at Ashworth's salons?"},
{skill:"Spot Hidden (empty frame hooks)",diff:"Hard",diffClass:"hard",outcome:"One frame was taken down recently, not cut. The mounting marks are fresh. Something specific was removed."}
],
keeperNote:"Don't rush past the dog portrait. It will get a laugh. Let it. Then let the silence come back in. The comedy and the horror are the same instrument playing different notes.\n\nThe empty frame (removed, not cut) is an optional extra detail — it was Ashworth's self-portrait. He took it down himself, after the Nov 2nd journal entry. He couldn't look at it anymore.",
clueIds:["portraits"],sanEvents:[{evt:"Gallery of faceless portraits",loss:"0/1",lvl:1}]},

{id:"a2_library",act:"act2",actLabel:"ACT TWO — THE BROWNSTONE",title:"2-2: The Library",duration:"25 min",
readAloud:`The library is a serious room — floor-to-ceiling shelves, green-shaded reading lamps, the smell of pipe tobacco and old paper. It is the room of a man who wanted to be taken seriously and owned the props for it.

On the central desk: a leather-bound journal, lying open.

On a wooden lectern near the window: something wrapped in oilcloth, small, apparently unremarkable. The oilcloth is tied with cord. The cord is the colour of old teeth.

On the wall, a gilt-framed oval mirror. Slightly too large for the space. The kind of mirror a vain man keeps.`,
content:`→ HANDOUT #2: ASHWORTH'S JOURNAL (desk)
Read key entries aloud in order. The first two-thirds are mundane. Then, three months ago:
• Oct 4: "The book arrived today. I am not sure what language it is. I am not sure it is a language."
• Oct 19: "I read aloud from page 47. Nothing happened. Or rather, nothing happened that I could see."
• Nov 2: "There is something behind my reflection now. Not in the mirror. Behind it. In the space where the reflection lives."
• Nov 14: "The salons are going splendidly. I am beginning to understand why it wants faces."
• Nov 29: "I think I invited it in. I cannot close the door. The threshold is midnight."
• [Final entry, four days ago]: "IT IS WEARING HENDERSON NOW. HENDERSON VISITED TUESDAY. I AM SO SORRY."

→ HANDOUT #3: THE FACELESS CODEX (on the lectern)
Any investigator attempting to study it: SAN roll 1/1D6.
  SUCCESS: Understand nothing. Feel profoundly watched.
  FAIL: Mind-heard (not aloud): "The Face is a door. The door can be opened from either side."
Academic / Doctor (Library Use): Script resembles pre-Columbian Mesoamerican glyphic writing — centuries old.
Occult (Hard): The text describes both a summoning AND a dismissal.

THE OVAL MIRROR: Mention it once, briefly, as part of setting the room. Don't call attention to it. It will be needed in Act Three.

THE MIDNIGHT DEADLINE: Library Use on the journal extracts the Nov 29 entry's threshold detail — midnight is the only remaining barrier to full manifestation.`,
mechanics:[
{skill:"Library Use (journal — deadline)",diff:"Normal",diffClass:"normal",outcome:"The midnight threshold. Partially manifested = stoppable now. Fully manifested = significantly worse."},
{skill:"Library Use (Codex script)",diff:"Normal (Academic/Doctor: auto)",diffClass:"auto",outcome:"Pre-Columbian Mesoamerican glyph-adjacent. Centuries old. No known language family matches."},
{skill:"Occult (Codex structure)",diff:"Hard",diffClass:"hard",outcome:"Both summoning text AND dismissal text. The ritual of reflection is in the latter sections. Three voices. One who does not look away."},
{skill:"SAN roll — studying Codex",diff:"1/1D6",diffClass:"hard",outcome:"Success: watched. Fail: mind-heard — 'The Face is a door. The door can be opened from either side.' This is the key to the banishment."}
],
keeperNote:"The Codex is the single most important object in the scenario. Handle it. Hold on it. The oilcloth should be handed to the player if possible — give them the prop.\n\nThe oval mirror: mention it once as set dressing. Don't point to it. Investigators who ask about it: old, gilt-framed, slightly too large for the space. The kind of mirror a vain man keeps. One of the investigators should remember it when Whitmore describes the banishment.\n\nThe empty self-portrait in the drawing room connects here: Nov 2nd, he couldn't look at his own reflection anymore.\n\nIF INVESTIGATORS TRY TO BURN THE CODEX: Stop them — Whitmore: \'You cannot burn it. I tried. The paper doesn\'t catch. Believe me, I would have done it by now.\' The Codex cannot be destroyed before the banishment. Afterwards: Whitmore takes it, claims to know someone who can dispose of it properly. (She does not. Vermont bank vault. Fine for approximately thirty years.)",
clueIds:["journal","codex","mirror"],sanEvents:[{evt:"Studying the Faceless Codex — failed roll",loss:"1/1D6",lvl:2}]},

{id:"a2_basement",act:"act2",actLabel:"ACT TWO — THE BROWNSTONE",title:"2-3: The Basement — Whitmore Found",duration:"20 min",
readAloud:`The basement stairs lead down into cold stone. At the bottom: a chalk circle on the floor, mostly smeared. Candles burned to nothing. The smell of chalk and old fear.

In the centre of the chalk circle, tied to a straight-backed wooden chair, blindfolded, with what appear to be earplugs carefully inserted: Professor Edna Whitmore. She is alive. Her visible hands are trembling.

When you remove the blindfold, she grabs the nearest person by the lapels before her eyes have fully adjusted, and says, very quietly:

"Don't let it see your face."`,
content:`WHITMORE'S EXPOSITION (deliver in a terrified professorial rush — brilliant, guilty, precise):

1. "The Skinless Watcher is a servitor entity — not a Great Old One, but a piece of one. Sent ahead as a scout."

2. "It cannot exist fully in the physical world without a face. A human face worn like a mask provides the anchor energy to solidify."

3. "Ashworth tried to close the ritual after the first death. He couldn't. He became its first face."

4. "The ritual circle in this basement almost worked. I was completing it when I heard the entity moving upstairs. So I did the only sensible thing."
[Someone will note that blindfolding yourself with earplugs in a ritual circle is not most people's definition of "sensible." Give her a moment to give them a look.]

5. THE BANISHMENT — three requirements:
   a) The Codex (investigators should have it)
   b) The original summoning point — THIS ROOM
   c) One investigator standing before the entity, holding a mirror, NOT LOOKING AWAY, while three others read from the Codex

KEY QUOTE: "I knew he was dabbling. I thought he was simply too stupid to do any real damage. I was half right."

THE DEADLINE CHECK: Ask Whitmore what time it is.
"A little after ten. We have perhaps ninety minutes before midnight. I suggest we do not spend them discussing options."`,
mechanics:[
{skill:"Medicine (examining Whitmore)",diff:"Normal",diffClass:"normal",outcome:"Physically sound. Dehydrated. Mild hypothermia from the stone floor. She will recover."},
{skill:"Psychology (reading Whitmore)",diff:"Normal",diffClass:"normal",outcome:"She is guilty. Has been berating herself for days. She didn't stop Ashworth when she could. She will not say this. A successful roll communicates it clearly."},
{skill:"Occult (confirming ritual info)",diff:"Normal",diffClass:"normal",outcome:"Everything Whitmore says matches what the Codex implied. The ritual structure is coherent. This can work."}
],
keeperNote:"This scene does two things: delivers the banishment information and introduces Whitmore as a character. Don't rush the character. She is funny, guilty, brilliant, and frightened. The joke about the blindfold should get a laugh before she continues.\n\nWhitmore's SAN is currently 40. She is operating on the professional equivalent of willpower. She holds together through the scenario. She may not hold together after.",
clueIds:["whitmore","banishment"],sanEvents:[]},

{id:"a2_herald",act:"act2",actLabel:"ACT TWO — THE BROWNSTONE",title:"2-4: The Herald Returns",duration:"10 min",
readAloud:`There is a sound from upstairs. A footstep placed slightly wrong — not a creak in the boards, but something that knows where the boards are and is trying to approximate walking correctly.

Then a pause.

Then, clearly, the sound of a vase being knocked over.

Then, after a moment's silence, a quiet, reflexive: "Oh. I'm terribly sorry."`,
content:`THE HERALD — Mr. Charles Henderson — is in the drawing room. He followed them from the Blue Orchid.

DESCRIPTION: Thin man, grey suit. His face moves slightly more than faces should — a constant minor resettling, like a mask seeking purchase. His eyes are Ashworth's. His hands, when he forgets himself, are his own. He is trying very hard to stand in a way that looks like standing.

THE APOLOGY: He knocked over the vase on the stairs. He apologised. This is:
• Funny (let the nervous laughter happen)
• Sad (Henderson is still in there)
• Important (note who at the table feels the sadness without being told to)

HENDERSON'S DETAILS:
Charles Henderson, 44, insurance clerk, Brooklyn. Wife: Margaret. Tabby cat — fed on Thursdays. He attended Ashworth's final salon because Ashworth owed him money and the gathering seemed an opportunity to raise the subject.

HENDERSON'S CAPABILITIES:
• Grapple: Fighting 45%, 1D6 crush per round held
• Stare: POW vs POW — failure = SAN 0/1D3
• Voice of Ashworth: SAN 0/1D4 (he says things only Ashworth would know; begs for help)
• HP: 12. He can be fought. He cannot be meaningfully killed.

THE RIGHT APPROACH: Contain, not fight. Persuade or Psychology. If investigators speak to Henderson as a person, he may surface enough to cooperate. This is the setup for Act Three's crucial moment.

COMBAT WARNING: Attacking too aggressively draws the Watcher sooner. Whitmore, from behind: "I would strongly advise against shooting things in the ritual room."`,
mechanics:[
{skill:"Spot Hidden (entering drawing room)",diff:"Normal",diffClass:"normal",outcome:"His shadow doesn't quite match his movements. Half a second out of sync."},
{skill:"Psychology (reading the Herald)",diff:"Hard",diffClass:"hard",outcome:"Henderson is in there. Something human and frightened is straining behind the entity's use of the body."},
{skill:"Persuade (speaking to Henderson)",diff:"Hard",diffClass:"hard",outcome:"He becomes briefly lucid. Voice quieter, more uncertain. He asks if anyone has spoken to his wife."},
{skill:"Fighting (containing)",diff:"Normal",diffClass:"normal",outcome:"He can be restrained with sustained effort. He is stronger than he looks."}
],
keeperNote:"The vase apology lands differently for different tables. Some laugh hard. Some laugh and immediately look away. The ones who look away have already understood what Henderson is. Watch for that.\n\nHe is the emotional spine of the scenario. Henderson's final line in Act Three — 'Tell my wife the cat needs feeding on Thursdays. She always forgets.' — must be earned here. The investigators need to know he's in there before that line can land.",
clueIds:[],sanEvents:[{evt:"Herald's face resettling (close view)",loss:"0/1D3",lvl:2},{evt:"Herald speaks with Ashworth's voice",loss:"0/1D4",lvl:2}]},

{id:"a3_circle",act:"act3",actLabel:"ACT THREE — THE WATCHER IN THE GLASS",title:"3-1: Completing the Circle",duration:"20 min",
readAloud:null,
content:`THE TASK: Restore the chalk ritual circle on the basement floor. Whitmore leads; investigators assist.

THREE SIMULTANEOUS REQUIREMENTS:
1. UNDERSTAND THE PATTERN — Occult roll (Whitmore guides on fail — costs 10 minutes)
2. DRAW THE CIRCLE — Art/Craft (Drawing) or DEX roll — steady hands required
3. HOLD OFF THE HERALD — he will try to disrupt. The entity wants the circle incomplete.

SPLIT THE TABLE:
Assign circle-completers (2-3 investigators + Whitmore) and Herald-handlers (1-2 investigators).
Run both groups simultaneously. Give both moments of focus.

HENDERSON DURING THIS SCENE:
Every time he moves toward the circle, part of him flinches. He doesn't want to do this. The entity does.
Investigators who watch carefully will see this — the internal struggle made physical.

The Herald speaks with Ashworth's voice from the wrong face while being managed:
SAN 0/1D4 for investigators who engage with the voice. He says things only Ashworth would know. He begs for help.

CLOCK: Establish at the start of this scene — 10:45 PM. Midnight is 75 minutes away.\n\nIF MIDNIGHT ARRIVES BEFORE THE RITUAL COMPLETES: Full manifestation. Mirror aversion fails, chalk circle loses power. Read aloud (failure): \'The grandfather clock above strikes twelve. You feel it as a physical thing — not a sound, a shift. A door opening somewhere much deeper than the basement floor. The Watcher turns, and something in its posture changes. It has been looking for faces. It stops looking. It begins taking.\' Total failure. No combat resolution. Flee or Face Peel. Honour it. Don\'t soften it.

WHEN CIRCLE IS COMPLETE: The temperature in the room drops. Not to cold. To wrong.`,
mechanics:[
{skill:"Occult (understanding the pattern)",diff:"Normal",diffClass:"normal",outcome:"The circle is a binding and reflecting structure. Completed, it amplifies the mirror aversion that ends the Watcher's anchorage."},
{skill:"Art/Craft (Drawing) or DEX",diff:"Normal",diffClass:"normal",outcome:"Completed without incident. Fail = one section redrawn — costs 10 minutes."},
{skill:"Psychology (Herald during work)",diff:"Normal",diffClass:"normal",outcome:"When he speaks in his own voice, his hands go still. When the entity reasserts, they start moving again — involuntary, reaching toward the chalk."}
],
keeperNote:"Run this as simultaneous action. Circle-completers narrate their work; Herald-handlers narrate the containment. The ticking is in the background — not foregrounded. Don't mechanically count down. Let it sit as background dread.\n\nThe moment the circle closes: pause. Let the temperature change land. Then read Act Three Scene 2's read-aloud.",
clueIds:[],sanEvents:[{evt:"Herald speaks with Ashworth's voice (Act Three)",loss:"0/1D4",lvl:2},{evt:"Failed Occult roll during circle work",loss:"1/1D4",lvl:2}]},

{id:"a3_watcher",act:"act3",actLabel:"ACT THREE — THE WATCHER IN THE GLASS",title:"3-2: The Watcher Arrives",duration:"35 min",
readAloud:`The temperature drops first — not to cold, but to wrong. The shadows in the corner of the room stop behaving. Then you see it, and your brain performs a small, polite act of mercy by refusing to fully process what it is.

It is tall. It is not quite standing. It has faces — several of them, worn one atop the other like pages in a book. The outermost is recent. You recognise it as Reginald Ashworth from his newspaper photograph.

He is smiling. He has always been smiling. He was smiling before his face was removed.

The thing beneath the faces has no features of its own. That is the worst part. It is looking at you with nothing. And you feel, with horrible certainty, that it is measuring your face.

Checking the fit.`,
content:`PHASE 1 — THE OFFERING OF REFLECTION:
One investigator must volunteer to stand before the Watcher holding the gilt-framed oval mirror from the library wall.

SAN ROLL: 1D6/1D20 to hold position.
• Hold → Watcher transfixed. It sees itself reflected with no face. Paralysed for the incantation's duration.
• Look away → Watcher lunges. Fighting 65%, Face Peel: 1D6 damage + 1D6 SAN per round held.

BEST CANDIDATES:
• Vivienne (Heiress) — social courage at its absolute limit. Her arc brings her here.
• Finch (Academic) — intellectual reckoning made physical. Thirty years studying belief, now required to act on it.
• Any investigator can step up. GIVE WHOEVER VOLUNTEERS A MOMENT OF GENUINE WEIGHT. Other players should watch.

IF NO ONE VOLUNTEERS: Whitmore does it. Hard SAN roll (1D6/1D10). Failure breaks paralysis early — Watcher acts for 1D3 rounds.

PHASE 2 — THE INCANTATION:
Whitmore leads three investigators reading from the Codex. Three consecutive Occult rolls (Hard).
Failed roll: SAN damage 1/1D4 as the words do things to the reader's mouth that words should not do. Ritual continues.

READ ALOUD (as they begin, then continue silently):
"Whatever face it wears, it is not the face. Whatever door it opens, the door opens from both sides. We name ourselves. We claim the threshold. We give it nothing. We give it nothing. We give it nothing."

[The words should not feel powerful. They should feel like standing very still while something enormous passes.]

PHASE 3 — HENDERSON'S CHOICE:
As the ritual nears completion, Henderson becomes lucid for a final moment.

Psychology or Persuade from an investigator — OR pure roleplay, granted automatically if players speak to Henderson as a person. The Keeper can simply grant it. Judge the moment.

He goes still. His hands stop moving. He says, in his own voice:
"Tell my wife the cat needs feeding on Thursdays. She always forgets."

Then the ritual completes.

THE BANISHMENT:
The Watcher collapses inward — not violently. It simply stops fitting in the physical world and falls through the floor like water through paper. The faces scatter across the stone. Ashworth's face settles face-down on the chalk circle. The Herald's body crumples. The candles relight themselves, and immediately go out.

Silence.

Professor Whitmore says: "Well. That was about what I expected."
Someone should laugh. Someone might cry. Both are correct.`,
mechanics:[
{skill:"SAN roll — holding the mirror",diff:"1D6/1D20",diffClass:"hard",outcome:"Hold: Watcher paralysed for duration. Look away: Watcher lunges — Face Peel attack, 1D6 damage + 1D6 SAN per round until free."},
{skill:"Occult × 3 — incantation (Hard)",diff:"Hard",diffClass:"hard",outcome:"Success: ritual progresses. Fail: SAN 1/1D4 — words behave incorrectly in the mouth. Ritual continues on any result."},
{skill:"Psychology / Persuade (Henderson — final)",diff:"Hard, or auto for genuine roleplay",diffClass:"hard",outcome:"Henderson goes still. His own voice returns. He delivers his last line. Ritual completes."},
{skill:"Fighting vs Face Peel",diff:"Opposed STR to break free",diffClass:"hard",outcome:"Break free: mirror can be re-established if holder hasn't lost consciousness."}
],
keeperNote:"THE LINE THAT MATTERS: 'Tell my wife the cat needs feeding on Thursdays. She always forgets.'\n\nDo not rush past it. Do not add anything after it. Count to three before Whitmore speaks. This is what the scenario is about.\n\nWhitmore's line is the release: 'Well. That was about what I expected.' It should get a laugh.\n\nThe final telegram, one week later: deliver it as coda. Cold hand on the back of the neck. End there. No explanation.",
clueIds:[],sanEvents:[
{evt:"First sight of the Skinless Watcher",loss:"1D3/1D10",lvl:4},
{evt:"Holding the mirror — volunteer",loss:"1D6/1D20",lvl:5},
{evt:"Face Peel attack (per round)",loss:"1D6 damage + 1D6 SAN",lvl:5},
{evt:"Henderson's final words",loss:"0/1D3",lvl:2},
{evt:"Banishment succeeds",loss:"GAIN +1D6",lvl:1}
]},

{id:"epilogue",act:"epilogue",actLabel:"EPILOGUE",title:"Aftermath — One Week Later",duration:"15 min",
readAloud:null,
content:`Address each investigator and NPC personally. Spend at least one sentence on each. Do not abbreviate.

INVESTIGATOR OUTCOMES:
• Helen (Reporter): Does she file the story? If yes — no editor will print it. She keeps the negatives. She keeps the dog portrait.
• Dr Graves: Whitmore's unpaid bills are on his desk when he returns. He tears them up. He doesn't know why.
• Mickey (PI): Returns to the office. Develops the photograph he burned in his mind. It is not there anymore. He sleeps that night.
• Lucky (Jazz): Sits in on a set at the Blue Orchid later that week. Band plays perfectly. No wrong notes. He doesn't know if that's better or worse.
• Vivienne (Heiress): The Foundation's books show $3,000 with no return on investment. She marks it "miscellaneous." She dreams of a corridor. Wakes before the door.
• Finch (Academic): Submits a paper on "pre-Columbian ritual structure in the New York metropolitan area, 1890–1924." The journal publishes a rejection note. He knows they are correct.

NPC OUTCOMES:
• Whitmore: Recovers. Publishes nothing. Retires to a cottage in Vermont. Keeps a very large number of cats.
• Delia Monroe: Hears nothing more from investigators. Considers this a good sign. Plays the Blue Orchid for another decade.
• Miss Pruitt: Receives telegram from Whitmore — "safe." Files it. Makes tea. Does not open it for three days.
• The Codex: RECOMMENDED: Destroyed. DANGEROUS: Locked away. IRRESPONSIBLE: Studied further — which is exactly what at least one investigator will want.
• Henderson's wife Margaret: Feeds the cat on Thursdays now. She doesn't know why she started.

FINAL BEAT — THE SECOND TELEGRAM:
One week later. Unknown sender. The telegram boy cannot describe who sent it.

"INTERESTING STOP WILL BE WATCHING STOP"

No return address. End of scenario.`,
mechanics:[],
keeperNote:"Spend a sentence on each character. Don't abbreviate the epilogue — this is fifteen minutes of earned space after everything the night took from these people.\n\nThe dog portrait going home with Helen gets one more laugh. Let it. Then end on the second telegram. Cold hand on the back of the neck. Don't explain it. Don't follow it. End there.",
clueIds:[],sanEvents:[]}
];

let currentScene=0,currentTab="scene",currentHandout=0;
let clueState={},sanState={};

function init(){
  INVESTIGATORS.forEach(i=>{sanState[i.id]=i.sanStart;});
  CLUES.forEach(c=>{clueState[c.id]=false;});
  buildSidebar();renderScene();renderNPCs();renderInvestigators();renderHandouts();renderClues();renderSAN();
  document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
  document.getElementById('btn-prev').addEventListener('click',()=>navigateScene(-1));
  document.getElementById('btn-next').addEventListener('click',()=>navigateScene(1));
}

function buildSidebar(){
  const sb=document.getElementById('sidebar');
  const acts={};
  SCENES.forEach((s,i)=>{if(!acts[s.act])acts[s.act]=[];acts[s.act].push({s,i});});
  Object.entries(acts).forEach(([act,items])=>{
    const block=document.createElement('div');block.className='act-block';
    const lbl=document.createElement('div');lbl.className='act-label-hd';
    lbl.style.cssText=`border-left:3px solid ${ACT_COLORS[act]||'#555'};padding-left:9px`;
    lbl.textContent=(items[0].s.actLabel.split(' — ')[0]||act).toUpperCase().replace('ACTLABEL:','');
    block.appendChild(lbl);
    items.forEach(({s,i})=>{
      const btn=document.createElement('button');btn.className='scene-btn';btn.id='sb-'+i;
      btn.style.borderLeftColor=ACT_COLORS[act]||'#555';
      btn.innerHTML=`<span class="dot" style="background:${ACT_COLORS[act]}"></span><span class="slabel">${s.title}<div class="sdur">${s.duration}</div></span>`;
      btn.addEventListener('click',()=>goToScene(i));block.appendChild(btn);
    });
    sb.appendChild(block);
  });
  const f=document.createElement('div');f.className='sidebar-footer';f.textContent='Event 93 · NYC 1924';sb.appendChild(f);
}

function goToScene(idx){
  currentScene=idx;
  if(currentTab!=='scene')switchTab('scene');else renderScene();
  document.querySelectorAll('.scene-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));
}

function navigateScene(dir){const n=currentScene+dir;if(n>=0&&n<SCENES.length)goToScene(n);}

function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===tab+'-panel'));
  if(tab==='scene')renderScene();
  if(tab==='clues')renderClues();
  if(tab==='san')renderSAN();
}

function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderScene(){
  const sc=SCENES[currentScene];
  const col=ACT_COLORS[sc.act]||'#c8860a';
  document.querySelectorAll('.scene-btn').forEach((b,i)=>b.classList.toggle('active',i===currentScene));
  let h=`<div class="scene-act" style="color:${col}">${sc.actLabel}</div>
<div class="scene-title">${sc.title}</div>
<div class="scene-meta">
  <span class="badge"><span style="color:${col}">●</span> ${sc.duration}</span>
  ${sc.clueIds.length?`<span class="badge clue">◆ ${sc.clueIds.length} clue${sc.clueIds.length>1?'s':''}</span>`:''}
  ${sc.sanEvents.length?`<span class="badge san">⚠ ${sc.sanEvents.length} SAN event${sc.sanEvents.length>1?'s':''}</span>`:''}
</div>`;
  if(sc.readAloud)h+=`<div class="read-aloud"><div class="ra-label">▶ READ ALOUD TO PLAYERS</div><div class="ra-text">${esc(sc.readAloud)}</div></div>`;
  if(sc.content)h+=`<div class="content-block"><div class="block-label">SCENE NOTES</div><div class="content-text">${esc(sc.content)}</div></div>`;
  if(sc.mechanics&&sc.mechanics.length){
    h+=`<div class="mech-table"><div class="mech-hd"><div>SKILL / ACTION</div><div>DIFFICULTY</div><div>OUTCOME</div></div>`;
    sc.mechanics.forEach(m=>h+=`<div class="mech-row"><div class="mech-skill">${esc(m.skill)}</div><div class="mech-diff ${m.diffClass}">${esc(m.diff)}</div><div class="mech-out">${esc(m.outcome)}</div></div>`);
    h+='</div>';
  }
  if(sc.sanEvents&&sc.sanEvents.length){
    h+=`<div class="san-block">`;
    sc.sanEvents.forEach(s=>{const g=s.loss.includes('GAIN');h+=`<div class="san-row"><span class="san-evt">${esc(s.evt)}</span><span class="san-loss ${g?'san-gain':''}">${esc(s.loss)}</span></div>`;});
    h+='</div>';
  }
  if(sc.clueIds&&sc.clueIds.length){
    h+=`<div class="content-block"><div class="block-label">CLUES THIS SCENE</div>`;
    sc.clueIds.forEach(cid=>{
      const c=CLUES.find(x=>x.id===cid);
      if(c)h+=`<div class="clue-item ${clueState[cid]?'done':''}" onclick="toggleClueFromScene('${cid}')"><div class="clue-chk">${clueState[cid]?'✓':''}</div><div><div class="clue-name">${c.label}${c.handout?`<span class="clue-handout">${c.handout}</span>`:''}</div><div class="clue-desc">${esc(c.desc)}</div></div></div>`;
    });h+='</div>';
  }
  if(sc.keeperNote)h+=`<div class="keeper-note"><div class="kn-label">⬛ KEEPER ONLY</div><div class="kn-text">${esc(sc.keeperNote)}</div></div>`;
  h+=`<div class="scene-fnav">
    ${currentScene>0?`<button class="fnav-btn" onclick="navigateScene(-1)">← ${SCENES[currentScene-1].title}</button>`:'<span></span>'}
    ${currentScene<SCENES.length-1?`<button class="fnav-btn next" onclick="navigateScene(1)">${SCENES[currentScene+1].title} →</button>`:''}
  </div>`;
  document.getElementById('scene-panel').innerHTML=h;
}

function toggleClueFromScene(id){clueState[id]=!clueState[id];renderScene();if(currentTab==='clues')renderClues();}

function renderNPCs(){
  let h=`<div class="scene-title" style="margin-bottom:18px">NPC Roster</div>`;
  NPCS.forEach(n=>{
    h+=`<div class="npc-card" id="npc-${n.id}" onclick="toggleNPC('${n.id}')">
<div class="npc-head"><div><div class="npc-name">${n.name}</div><div class="npc-role">${n.role}</div></div>
<span class="npc-deploy-tag">${n.deploy}</span><span class="npc-chevron">▼</span></div>
<div class="npc-body">
<div class="two-col"><div><div class="mini-label">APPEARANCE</div><div class="mini-text">${esc(n.appearance)}</div></div>
<div><div class="mini-label">KEEPER TRUTH</div><div class="mini-text">${esc(n.truth)}</div></div></div>
${n.stats.length?`<div class="stat-pills">${n.stats.map(s=>`<div class="stat-pill"><div class="sl">${s.l}</div><div class="sv">${s.v}</div></div>`).join('')}</div>`:''}
${n.extras?`<div class="stat-extras">${esc(n.extras)}</div>`:''}
<div class="keeper-note"><div class="kn-label">KEEPER NOTE</div><div class="kn-text">${esc(n.note)}</div></div>
</div></div>`;
  });
  document.getElementById('npcs-panel').innerHTML=h;
}

function toggleNPC(id){
  const el=document.getElementById('npc-'+id);el.classList.toggle('open');
  el.querySelector('.npc-chevron').textContent=el.classList.contains('open')?'▲':'▼';
}

function renderInvestigators(){
  let h=`<div class="scene-title" style="margin-bottom:18px">Investigators — Pre-Generated</div>`;
  // Players table
  h+=`<div class="content-block" style="margin-bottom:20px"><div class="block-label">TABLE — PLAYERS</div><div style="display:flex;flex-wrap:wrap;gap:8px">`;
  PLAYERS.forEach(p=>h+=`<div style="background:var(--surface-top);border:1px solid var(--border-hi);border-radius:3px;padding:5px 12px;font-size:12px;color:var(--text-sub)">${p.name}</div>`);
  h+=`</div></div>`;
  INVESTIGATORS.forEach(inv=>{
    const san=sanState[inv.id],pct=Math.max(0,san/inv.sanStart*100);
    const bc=pct>60?'#4a9a4a':pct>30?'#a07030':'#cc3333';
    h+=`<div class="inv-card" id="inv-${inv.id}" onclick="toggleInv('${inv.id}')">
<div class="inv-head">
  <div class="inv-name">${inv.name}</div><span class="inv-role-tag">${inv.role}</span>
  <div class="inv-san-ctrl" onclick="event.stopPropagation()">
    <div><div class="san-lbl">SAN</div>
    <div class="san-box">
      <button class="san-mod minus" onclick="modSAN('${inv.id}',-1)">−</button>
      <div class="san-val" style="color:${bc}">${san}</div>
      <button class="san-mod plus" onclick="modSAN('${inv.id}',1)">+</button>
    </div>
    <div class="san-bar-wrap"><div class="san-bar" style="width:${pct}%;background:${bc}"></div></div>
    <div class="san-base">/ ${inv.sanStart}</div></div>
  </div>
  <span class="inv-chevron">▼</span>
</div>
<div class="inv-body">
  <div class="hook-box"><span class="hook-lbl">PLAYER HOOK</span>${esc(inv.hook)}</div>
  <div class="hook-box"><span class="hook-lbl">KEEPER TRUTH</span>${esc(inv.hookKpr)}</div>
  <div style="font-size:12px;color:#6a8a7a;font-style:italic;margin-bottom:12px">"${esc(inv.quote)}"</div>
  <div class="stats-grid">${Object.entries(inv.stats).map(([k,v])=>`<div class="stat-cell"><div class="sk">${k}</div><div class="sv">${v}</div></div>`).join('')}</div>
  <div class="derived-row">${Object.entries(inv.derived).map(([k,v])=>`<div class="der-pill"><span class="der-k">${k}</span><span class="der-v">${v}</span></div>`).join('')}</div>
  <div class="mini-label">KEY SKILLS</div><div class="skills-text">${esc(inv.skills)}</div>
  <div class="mini-label">EQUIPMENT</div><div class="skills-text">${esc(inv.equipment)}</div>
  <div class="trigger-box"><div class="trig-lbl">SAN TRIGGER</div><div class="trig-text">${esc(inv.trigger)}</div></div>
</div></div>`;
  });
  document.getElementById('investigators-panel').innerHTML=h;
}

function toggleInv(id){
  const el=document.getElementById('inv-'+id);el.classList.toggle('open');
  el.querySelector('.inv-chevron').textContent=el.classList.contains('open')?'▲':'▼';
}

function modSAN(id,d){
  const inv=INVESTIGATORS.find(i=>i.id===id);
  sanState[id]=Math.max(0,Math.min(inv.sanStart,sanState[id]+d));
  renderInvestigators();if(currentTab==='san')renderSAN();
}

function renderHandouts(){
  const p=document.getElementById('handouts-panel');
  let lh=`<div class="handout-list"><div class="handout-list-lbl">DOCUMENTS</div>`;
  HANDOUTS.forEach((h,i)=>lh+=`<button class="hdoc-btn ${i===0?'active':''}" onclick="showHandout(${i})"><div class="hdoc-num">${h.num}</div><div class="hdoc-name">${h.name}</div></button>`);
  lh+='</div>';
  p.innerHTML=lh+`<div class="handout-view" id="handout-view"></div>`;
  showHandout(0);
}

function showHandout(idx){
  currentHandout=idx;const h=HANDOUTS[idx];
  document.querySelectorAll('.hdoc-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));
  document.getElementById('handout-view').innerHTML=`<div class="hv-title">${h.num} — ${h.name}</div><div class="hv-note">${esc(h.note)}</div><div class="hv-paper"><div class="hv-text">${esc(h.text)}</div></div>`;
}

function renderClues(){
  const found=Object.values(clueState).filter(Boolean).length;
  const groups=[
    {key:'intro',label:'INTRODUCTION',color:ACT_COLORS.intro},
    {key:'act1',label:'ACT ONE — THE BLUE ORCHID',color:ACT_COLORS.act1},
    {key:'act2',label:'ACT TWO — THE BROWNSTONE',color:ACT_COLORS.act2}
  ];
  let h=`<div class="clues-hd"><div class="scene-title">Evidence Tracker</div><div class="clues-count">${found} / ${CLUES.length} found</div></div>`;
  groups.forEach(g=>{
    const items=CLUES.filter(c=>c.act===g.key);if(!items.length)return;
    h+=`<div class="act-clue-group"><div class="act-clue-hd" style="color:${g.color};border-bottom-color:${g.color}33">${g.label}</div>`;
    items.forEach(c=>h+=`<div class="clue-item ${clueState[c.id]?'done':''}" onclick="toggleClue('${c.id}')"><div class="clue-chk">${clueState[c.id]?'✓':''}</div><div><div class="clue-name">${c.label}${c.handout?`<span class="clue-handout">${c.handout}</span>`:''}</div><div class="clue-desc">${esc(c.desc)}</div></div></div>`);
    h+='</div>';
  });
  h+=`<button class="reset-btn" onclick="resetClues()">↺ RESET ALL CLUES</button>`;
  document.getElementById('clues-panel').innerHTML=h;
}

function toggleClue(id){clueState[id]=!clueState[id];renderClues();if(currentTab==='scene')renderScene();}
function resetClues(){CLUES.forEach(c=>{clueState[c.id]=false;});renderClues();}

function renderSAN(){
  let h=`<div class="scene-title" style="margin-bottom:18px">Sanity Reference</div>`;
  h+=`<div class="mini-label" style="margin-bottom:8px">TONE MANAGEMENT GUIDE</div>
<div class="tone-table"><div class="tone-hd"><div>PHASE</div><div>TONE TARGET</div><div>HOW TO ACHIEVE IT</div></div>`;
  TONE_TABLE.forEach(t=>h+=`<div class="tone-row"><div class="tone-phase">${t.phase}</div><div class="tone-target">${t.target}</div><div class="tone-how">${esc(t.how)}</div></div>`);
  h+='</div>';
  h+=`<div class="mini-label" style="margin-bottom:8px">SAN EVENT REFERENCE</div>
<div class="san-ref-table"><div class="san-ref-hd"><div>EVENT</div><div>LOSS / GAIN</div></div>`;
  SAN_TABLE.forEach(s=>{
    const g=s.loss.includes('GAIN');
    const col=g?'#4a9a4a':SAN_COLORS[s.lvl]||'#cc3333';
    h+=`<div class="san-ref-row"><div class="san-ref-evt">${esc(s.evt)}</div><div class="san-ref-loss" style="color:${col}">${esc(s.loss)}</div></div>`;
  });
  h+='</div>';
  h+=`<div class="mini-label" style="margin-bottom:8px">INVESTIGATOR SAN TRACKER</div><div class="inv-san-grid">`;
  INVESTIGATORS.forEach(inv=>{
    const san=sanState[inv.id],pct=Math.max(0,san/inv.sanStart*100);
    const bc=pct>60?'#4a9a4a':pct>30?'#a07030':'#cc3333';
    h+=`<div class="inv-san-card" style="border-color:${bc}22;background:${bc}08">
<div class="isc-name">${inv.name}<br><span style="font-size:9px;color:var(--text-muted)">${inv.role}</span></div>
<div class="isc-ctrl">
  <button class="san-mod minus" onclick="modSAN('${inv.id}',-1)">−</button>
  <div class="isc-val" style="color:${bc}">${san}</div>
  <button class="san-mod plus" onclick="modSAN('${inv.id}',1)">+</button>
</div>
<div class="san-bar-wrap"><div class="san-bar" style="width:${pct}%;background:${bc}"></div></div>
<div class="isc-base">/ ${inv.sanStart} base</div></div>`;
  });
  h+='</div>';
  document.getElementById('san-panel').innerHTML=h;
}

const CLOCK_TIMES=["8:00 PM","8:30 PM","9:00 PM","9:30 PM","10:00 PM","10:30 PM","10:45 PM","11:00 PM","11:15 PM","11:30 PM","11:45 PM","MIDNIGHT"];
let clockIdx=0;
function advanceClock(){
  clockIdx=Math.min(clockIdx+1,CLOCK_TIMES.length-1);
  const t=CLOCK_TIMES[clockIdx];
  const el=document.getElementById('game-clock');
  el.textContent=t;
  if(t==="MIDNIGHT"){el.style.color="#cc3333";el.style.textShadow="0 0 8px #cc333388";}
  else if(clockIdx>=9){el.style.color="#c85020";}
  else if(clockIdx>=6){el.style.color="#c87030";}
}

init();
</script>
</body>
</html>
