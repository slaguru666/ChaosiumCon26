<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a2a1a" stroke-width="0.5"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4aff4a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0a0f0a"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Title block -->
  <rect x="10" y="10" width="780" height="40" fill="#0d1a0d" stroke="#2a4a2a" stroke-width="1"/>
  <text x="400" y="30" text-anchor="middle" fill="#4aff4a" font-size="14" font-weight="bold" letter-spacing="3">KELLER-VOSS ENERGY PLANT — GROUND LEVEL &amp; EXTERIOR</text>
  <text x="400" y="44" text-anchor="middle" fill="#2a6a2a" font-size="9" letter-spacing="2">BPN: BLUE-DT2-4478-MAINT  |  SECTOR 18, DOWNTOWN DISTRICT 2</text>

  <!-- Outer fence boundary -->
  <rect x="60" y="70" width="680" height="480" fill="none" stroke="#3a5a3a" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="400" y="88" text-anchor="middle" fill="#2a5a2a" font-size="9" letter-spacing="2">— PERIMETER FENCE (4M CHAIN-LINK / DEFUNCT RAZORWIRE) —</text>

  <!-- Main gate (north fence, centre) -->
  <rect x="360" y="68" width="80" height="6" fill="#0a0f0a"/>
  <line x1="360" y1="71" x2="380" y2="71" stroke="#4aff4a" stroke-width="2"/>
  <line x1="420" y1="71" x2="440" y2="71" stroke="#4aff4a" stroke-width="2"/>
  <text x="400" y="66" text-anchor="middle" fill="#ffaa00" font-size="9">MAIN GATE (OPEN / CUT)</text>

  <!-- Road / approach -->
  <rect x="370" y="56" width="60" height="14" fill="#111811"/>
  <line x1="400" y1="56" x2="400" y2="70" stroke="#ffaa00" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Civilian memorials markers -->
  <circle cx="130" cy="150" r="5" fill="none" stroke="#ff6644" stroke-width="1.5"/>
  <text x="140" y="153" fill="#ff6644" font-size="8">✝ MEMORIAL</text>
  <circle cx="130" cy="380" r="5" fill="none" stroke="#ff6644" stroke-width="1.5"/>
  <text x="140" y="383" fill="#ff6644" font-size="8">✝ MEMORIAL</text>

  <!-- Graffiti markers -->
  <text x="65" y="250" fill="#2a5a2a" font-size="8" font-style="italic">"STAY OUT —</text>
  <text x="65" y="262" fill="#2a5a2a" font-size="8" font-style="italic">THEY'RE WATCHING"</text>
  <text x="65" y="274" fill="#1a3a1a" font-size="7">— VOLT RUNNERS</text>

  <!-- Plant building footprint -->
  <rect x="140" y="120" width="520" height="380" fill="#0d160d" stroke="#2a4a2a" stroke-width="2"/>

  <!-- Building label -->
  <text x="400" y="145" text-anchor="middle" fill="#2a4a2a" font-size="10" letter-spacing="2">KELLER-VOSS GENERATION PLANT</text>

  <!-- Loading bay area (east side, ground level access) -->
  <rect x="580" y="250" width="80" height="100" fill="#111811" stroke="#3a6a3a" stroke-width="1.5"/>
  <text x="620" y="270" text-anchor="middle" fill="#4aff4a" font-size="9" letter-spacing="1">LOADING</text>
  <text x="620" y="283" text-anchor="middle" fill="#4aff4a" font-size="9" letter-spacing="1">BAY</text>
  <!-- Roller door (partially raised) -->
  <rect x="656" y="255" width="6" height="90" fill="#1a2a1a" stroke="#3a6a3a" stroke-width="1"/>
  <line x1="656" y1="255" x2="660" y2="255" stroke="#4aff4a" stroke-width="2"/>
  <text x="672" y="262" fill="#ffaa00" font-size="8">DOOR</text>
  <text x="672" y="273" fill="#ffaa00" font-size="8">PARTIAL</text>

  <!-- Blood trail from loading bay inward -->
  <path d="M 656 290 Q 600 290 540 270 Q 480 250 440 240" fill="none" stroke="#8b0000" stroke-width="2" stroke-dasharray="5,3" opacity="0.7"/>
  <text x="490" y="235" fill="#8b0000" font-size="8">BLOOD TRAIL</text>

  <!-- Perimeter camera (east fence, visibly tracking) -->
  <rect x="638" y="168" width="12" height="8" fill="#333" stroke="#ffaa00" stroke-width="1"/>
  <circle cx="644" cy="172" r="3" fill="none" stroke="#ff4444" stroke-width="1.5" filter="url(#glow)"/>
  <text x="654" y="172" fill="#ff4444" font-size="8">CAM (SHOULD BE OFFLINE)</text>

  <!-- Main entry doors (north face of building) -->
  <rect x="355" y="120" width="90" height="8" fill="#0a0f0a"/>
  <line x1="355" y1="124" x2="380" y2="124" stroke="#3a6a3a" stroke-width="2"/>
  <line x1="420" y1="124" x2="445" y2="124" stroke="#3a6a3a" stroke-width="2"/>
  <text x="400" y="118" text-anchor="middle" fill="#2a5a2a" font-size="8">MAIN ENTRANCE (SEALED)</text>

  <!-- Stairwell down markers -->
  <rect x="200" y="160" width="50" height="40" fill="#111811" stroke="#2a5a2a" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="225" y="178" text-anchor="middle" fill="#2a5a2a" font-size="8">STAIR</text>
  <text x="225" y="190" text-anchor="middle" fill="#2a5a2a" font-size="8">▼ SL1</text>

  <rect x="540" y="160" width="50" height="40" fill="#111811" stroke="#2a5a2a" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="565" y="178" text-anchor="middle" fill="#2a5a2a" font-size="8">STAIR</text>
  <text x="565" y="190" text-anchor="middle" fill="#2a5a2a" font-size="8">▼ SL1</text>

  <!-- Central plant floor space -->
  <rect x="260" y="200" width="280" height="240" fill="#0a120a" stroke="#1a3a1a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="400" y="255" text-anchor="middle" fill="#1a3a1a" font-size="9" letter-spacing="1">GROUND FLOOR</text>
  <text x="400" y="270" text-anchor="middle" fill="#1a3a1a" font-size="9" letter-spacing="1">OPERATIONS FLOOR</text>
  <text x="400" y="285" text-anchor="middle" fill="#1a3a1a" font-size="9">(abandoned / empty)</text>

  <!-- Freight elevator -->
  <rect x="350" y="380" width="60" height="40" fill="#111811" stroke="#3a5a3a" stroke-width="1"/>
  <text x="380" y="396" text-anchor="middle" fill="#3a5a3a" font-size="8">FREIGHT</text>
  <text x="380" y="408" text-anchor="middle" fill="#3a5a3a" font-size="8">LIFT ▼</text>

  <!-- Approach arrow -->
  <line x1="400" y1="56" x2="400" y2="70" stroke="#4aff4a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="52" text-anchor="middle" fill="#4aff4a" font-size="9">APPROACH</text>

  <!-- North compass -->
  <text x="744" y="100" text-anchor="middle" fill="#2a5a2a" font-size="20">↑</text>
  <text x="744" y="115" text-anchor="middle" fill="#2a5a2a" font-size="9">N</text>

  <!-- Legend -->
  <rect x="60" y="530" width="680" height="56" fill="#0d1a0d" stroke="#1a3a1a" stroke-width="1"/>
  <text x="80" y="545" fill="#4aff4a" font-size="8" font-weight="bold">LEGEND:</text>
  <rect x="80" y="550" width="10" height="6" fill="none" stroke="#4aff4a" stroke-width="1"/>
  <text x="95" y="558" fill="#3a6a3a" font-size="8">BUILDING</text>
  <line x1="150" y1="553" x2="170" y2="553" stroke="#3a5a3a" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="175" y="558" fill="#3a6a3a" font-size="8">FENCE</text>
  <circle cx="235" cy="553" r="4" fill="none" stroke="#ff6644" stroke-width="1.5"/>
  <text x="245" y="558" fill="#ff6644" font-size="8">MEMORIAL</text>
  <line x1="320" y1="553" x2="340" y2="553" stroke="#8b0000" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="345" y="558" fill="#8b0000" font-size="8">BLOOD TRAIL</text>
  <circle cx="440" cy="553" r="3" fill="none" stroke="#ff4444" stroke-width="1.5"/>
  <text x="450" y="558" fill="#ff4444" font-size="8">ACTIVE CAMERA</text>
  <rect x="550" y="549" width="10" height="6" fill="#111811" stroke="#2a5a2a" stroke-width="1" stroke-dasharray="2,1"/>
  <text x="565" y="558" fill="#2a5a2a" font-size="8">STAIRWELL DOWN</text>

  <!-- Footer -->
  <text x="400" y="592" text-anchor="middle" fill="#1a3a1a" font-size="8" letter-spacing="1">POWER FAILURE — GM REFERENCE — NOT FOR PLAYER DISTRIBUTION</text>
</svg>