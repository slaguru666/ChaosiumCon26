<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a0a0a" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="rupture" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#660033" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#330011" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a0005" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ruptureCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0066"/>
      <stop offset="60%" stop-color="#880033"/>
      <stop offset="100%" stop-color="#330011"/>
    </radialGradient>
    <filter id="pulseglow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="catwalk" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 10 M 0 0 L 10 10" fill="none" stroke="#3a1a1a" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="#080005"/>
  <rect width="900" height="700" fill="url(#grid)"/>

  <!-- Title block -->
  <rect x="10" y="10" width="880" height="40" fill="#140010" stroke="#3a0030" stroke-width="1"/>
  <text x="450" y="30" text-anchor="middle" fill="#ff44aa" font-size="14" font-weight="bold" letter-spacing="3">KELLER-VOSS PLANT — SUB-LEVELS 2 &amp; 3 (DEEP)</text>
  <text x="450" y="44" text-anchor="middle" fill="#6a0050" font-size="9" letter-spacing="2">GENERATOR HALL / CONCEALED RESEARCH WING / RUPTURE CHAMBER  |  DEPTH: -18M TO -30M</text>

  <!-- ===================== CONCEALED RESEARCH WING (Sub-Level 2) ===================== -->

  <!-- Research wing outer walls -->
  <rect x="60" y="65" width="320" height="240" fill="#0c0010" stroke="#4a006a" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="220" y="85" text-anchor="middle" fill="#8800cc" font-size="11" font-weight="bold" letter-spacing="2">CONCEALED RESEARCH WING</text>
  <text x="220" y="98" text-anchor="middle" fill="#5500aa" font-size="8" letter-spacing="1">(Sub-Level 2 — Hidden / Off-Books)</text>
  <text x="220" y="110" text-anchor="middle" fill="#4400aa" font-size="8">Access via false panel — keycard required</text>

  <!-- Research Lab A (main lab) -->
  <rect x="75" y="120" width="180" height="120" fill="#0a000e" stroke="#3a0055" stroke-width="1.5"/>
  <text x="165" y="138" text-anchor="middle" fill="#6600aa" font-size="9" letter-spacing="1">MAIN LAB</text>

  <!-- Whiteboards -->
  <rect x="85" y="145" width="60" height="35" fill="#080010" stroke="#4400aa" stroke-width="1"/>
  <text x="115" y="157" text-anchor="middle" fill="#4400aa" font-size="7">EBB/ENERGY</text>
  <text x="115" y="167" text-anchor="middle" fill="#4400aa" font-size="7">EQUATIONS</text>
  <text x="115" y="177" text-anchor="middle" fill="#6600aa" font-size="7">◈ CLUE</text>

  <!-- Vasquez's terminal -->
  <rect x="160" y="145" width="40" height="25" fill="#050010" stroke="#ff44aa" stroke-width="2" filter="url(#softglow)"/>
  <text x="180" y="157" text-anchor="middle" fill="#ff44aa" font-size="7">TERMINAL</text>
  <text x="180" y="167" text-anchor="middle" fill="#aa2266" font-size="7">◈ KEY</text>
  <text x="202" y="155" fill="#ff44aa" font-size="7">VASQUEZ</text>
  <text x="202" y="165" fill="#aa2266" font-size="7">pw: "ailuJ"</text>
  <line x1="200" y1="157" x2="202" y2="157" stroke="#ff44aa" stroke-width="1"/>

  <!-- Dissection tables -->
  <rect x="85" y="195" width="155" height="20" fill="#060010" stroke="#2a0044" stroke-width="1"/>
  <line x1="140" y1="195" x2="140" y2="215" stroke="#1a0033" stroke-width="1"/>
  <line x1="195" y1="195" x2="195" y2="215" stroke="#1a0033" stroke-width="1"/>
  <text x="162" y="208" text-anchor="middle" fill="#2a0044" font-size="7">DISSECTION TABLES (RESTRAINED)</text>

  <!-- Suspension jars -->
  <circle cx="100" cy="232" r="8" fill="#060015" stroke="#4400aa" stroke-width="1"/>
  <circle cx="120" cy="232" r="8" fill="#060015" stroke="#4400aa" stroke-width="1"/>
  <circle cx="140" cy="232" r="8" fill="#060015" stroke="#4400aa" stroke-width="1"/>
  <text x="130" y="227" text-anchor="middle" fill="#4400aa" font-size="7">SPECIMEN JARS</text>

  <!-- Research Lab B (secondary) -->
  <rect x="265" y="120" width="100" height="120" fill="#0a000e" stroke="#3a0055" stroke-width="1.5"/>
  <text x="315" y="138" text-anchor="middle" fill="#5500aa" font-size="9">LAB B</text>
  <rect x="275" y="148" width="80" height="60" fill="#060010" stroke="#2a0044" stroke-width="1"/>
  <text x="315" y="165" text-anchor="middle" fill="#2a0044" font-size="7">PERSONNEL FILES</text>
  <text x="315" y="177" text-anchor="middle" fill="#4400aa" font-size="7">◈ KELLER PROTEST</text>
  <text x="315" y="189" text-anchor="middle" fill="#2a0044" font-size="7">(exonerates Keller)</text>
  <text x="315" y="201" text-anchor="middle" fill="#2a0044" font-size="7">Research journal</text>
  <text x="315" y="213" text-anchor="middle" fill="#4400aa" font-size="7">◈ VASQUEZ LOG</text>

  <!-- Access point annotation -->
  <text x="220" y="270" text-anchor="middle" fill="#6600aa" font-size="9" font-style="italic">DR. VASQUEZ patrols this wing</text>
  <text x="220" y="282" text-anchor="middle" fill="#4400aa" font-size="8">Ebb contact possible — trapped fragment</text>
  <text x="220" y="294" text-anchor="middle" fill="#4400aa" font-size="8">will provide: overload sequence + Marn identity</text>

  <!-- Connecting passage to generator hall -->
  <rect x="350" y="170" width="40" height="30" fill="#0a0010" stroke="#4a0066" stroke-width="1.5"/>
  <text x="370" y="183" text-anchor="middle" fill="#4a0066" font-size="8">PASS</text>
  <text x="370" y="194" text-anchor="middle" fill="#4a0066" font-size="8">→</text>

  <!-- ===================== PRIMARY GENERATOR HALL (Sub-Level 3) ===================== -->

  <!-- Generator hall outer walls — cathedral space -->
  <rect x="410" y="65" width="460" height="370" fill="#0a0005" stroke="#3a0020" stroke-width="3"/>
  <text x="640" y="88" text-anchor="middle" fill="#ff4444" font-size="11" font-weight="bold" letter-spacing="2">PRIMARY GENERATOR HALL</text>
  <text x="640" y="101" text-anchor="middle" fill="#6a0020" font-size="8" letter-spacing="1">"Cathedral space" — turbines silent — catwalks overhead</text>

  <!-- Turbine units (massive silent machines) -->
  <rect x="430" y="115" width="70" height="90" fill="#120008" stroke="#3a0020" stroke-width="2" rx="5"/>
  <text x="465" y="148" text-anchor="middle" fill="#3a0020" font-size="8">TURBINE</text>
  <text x="465" y="160" text-anchor="middle" fill="#3a0020" font-size="8">A</text>
  <text x="465" y="172" text-anchor="middle" fill="#2a0015" font-size="7">SILENT</text>

  <rect x="530" y="115" width="70" height="90" fill="#120008" stroke="#3a0020" stroke-width="2" rx="5"/>
  <text x="565" y="148" text-anchor="middle" fill="#3a0020" font-size="8">TURBINE</text>
  <text x="565" y="160" text-anchor="middle" fill="#3a0020" font-size="8">B</text>
  <text x="565" y="172" text-anchor="middle" fill="#2a0015" font-size="7">SILENT</text>

  <rect x="630" y="115" width="70" height="90" fill="#120008" stroke="#3a0020" stroke-width="2" rx="5"/>
  <text x="665" y="148" text-anchor="middle" fill="#3a0020" font-size="8">TURBINE</text>
  <text x="665" y="160" text-anchor="middle" fill="#3a0020" font-size="8">C</text>
  <text x="665" y="172" text-anchor="middle" fill="#2a0015" font-size="7">SILENT</text>

  <rect x="730" y="115" width="70" height="90" fill="#120008" stroke="#3a0020" stroke-width="2" rx="5"/>
  <text x="765" y="148" text-anchor="middle" fill="#3a0020" font-size="8">TURBINE</text>
  <text x="765" y="160" text-anchor="middle" fill="#3a0020" font-size="8">D</text>
  <text x="765" y="172" text-anchor="middle" fill="#2a0015" font-size="7">SILENT</text>

  <!-- Catwalks overhead (cross-hatch fill) -->
  <rect x="420" y="110" width="440" height="15" fill="url(#catwalk)" stroke="#2a0015" stroke-width="1" opacity="0.8"/>
  <text x="640" y="122" text-anchor="middle" fill="#2a0015" font-size="7">CATWALK LEVEL (OVERHEAD)</text>

  <rect x="415" y="245" width="450" height="12" fill="url(#catwalk)" stroke="#2a0015" stroke-width="1" opacity="0.6"/>

  <!-- Floor space (patrol territory) -->
  <rect x="420" y="220" width="440" height="120" fill="url(#catwalk)" opacity="0.2"/>

  <!-- Keller patrol territory -->
  <path d="M 480 225 Q 640 225 800 225 Q 800 320 640 340 Q 480 340 480 320 Z" fill="none" stroke="#ff4444" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.6"/>
  <text x="640" y="275" text-anchor="middle" fill="#ff4444" font-size="9" filter="url(#softglow)">⚠ KELLER PATROL ZONE</text>
  <text x="640" y="288" text-anchor="middle" fill="#aa2222" font-size="8">Ambush specialist — knows every shadow</text>
  <text x="640" y="300" text-anchor="middle" fill="#882222" font-size="8">Combat: grapple + energy drain on contact</text>
  <text x="640" y="312" text-anchor="middle" fill="#661111" font-size="8" font-style="italic">Consciousness fights entity — brief hesitation possible</text>

  <!-- Hammer-6 corpses -->
  <text x="455" y="245" fill="#8b0000" font-size="14" filter="url(#softglow)">†</text>
  <text x="423" y="258" fill="#8b0000" font-size="7">HAMMER-6</text>
  <text x="423" y="268" fill="#8b0000" font-size="7">OPERATIVE</text>
  <text x="423" y="278" fill="#660000" font-size="7">desiccated</text>

  <text x="810" y="270" fill="#8b0000" font-size="14" filter="url(#softglow)">†</text>
  <text x="800" y="283" fill="#8b0000" font-size="7">HAMMER-6</text>
  <text x="800" y="293" fill="#8b0000" font-size="7">OPERATIVE</text>
  <text x="800" y="303" fill="#660000" font-size="7">desiccated</text>

  <!-- Maintenance sublevel C-7 (weapons cache) -->
  <rect x="420" y="355" width="120" height="65" fill="#0c0008" stroke="#2a4a1a" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="480" y="372" text-anchor="middle" fill="#3a6a2a" font-size="9" letter-spacing="1">MAINTENANCE</text>
  <text x="480" y="385" text-anchor="middle" fill="#3a6a2a" font-size="9">CORRIDOR C-7</text>
  <rect x="490" y="393" width="40" height="20" fill="#0a0a08" stroke="#4a8a2a" stroke-width="2"/>
  <text x="510" y="403" text-anchor="middle" fill="#4a8a2a" font-size="7">PANEL</text>
  <text x="510" y="413" text-anchor="middle" fill="#4aff2a" font-size="7">34-B</text>
  <text x="548" y="400" fill="#3a6a2a" font-size="7">◈ CACHE</text>
  <text x="548" y="410" fill="#2a5a1a" font-size="7">2× FEN AR</text>
  <text x="548" y="420" fill="#2a5a1a" font-size="7">4× FRAG</text>

  <!-- Stairwells into generator hall -->
  <rect x="820" y="115" width="40" height="50" fill="#120010" stroke="#3a0030" stroke-width="1.5"/>
  <text x="840" y="135" text-anchor="middle" fill="#4a0050" font-size="8">STAIR</text>
  <text x="840" y="148" text-anchor="middle" fill="#4a0050" font-size="8">▲ SL1</text>
  <text x="840" y="160" text-anchor="middle" fill="#7a0080" font-size="8">▼ RC</text>

  <rect x="820" y="320" width="40" height="50" fill="#120010" stroke="#3a0030" stroke-width="1.5"/>
  <text x="840" y="340" text-anchor="middle" fill="#4a0050" font-size="8">STAIR</text>
  <text x="840" y="353" text-anchor="middle" fill="#4a0050" font-size="8">▲ SL1</text>
  <text x="840" y="365" text-anchor="middle" fill="#7a0080" font-size="8">▼ RC</text>

  <!-- ===================== RUPTURE CHAMBER ===================== -->

  <!-- Chamber outer boundary (spherical — shown as circle in plan) -->
  <rect x="60" y="340" width="680" height="300" fill="#080005" stroke="#1a0010" stroke-width="1"/>

  <!-- Chamber label -->
  <text x="400" y="362" text-anchor="middle" fill="#880033" font-size="11" font-weight="bold" letter-spacing="3">THE RUPTURE CHAMBER</text>
  <text x="400" y="375" text-anchor="middle" fill="#550022" font-size="8" letter-spacing="1">Spherical — 20m diameter — walls scorched black — Sub-Level 3 deep</text>

  <!-- Reality distortion field -->
  <circle cx="400" cy="510" r="160" fill="url(#rupture)" opacity="0.4"/>
  <circle cx="400" cy="510" r="120" fill="url(#rupture)" opacity="0.3"/>
  <circle cx="400" cy="510" r="80" fill="url(#rupture)" opacity="0.5"/>

  <!-- Gravity distortion zones -->
  <circle cx="400" cy="510" r="155" fill="none" stroke="#440022" stroke-width="1" stroke-dasharray="8,4" opacity="0.5"/>
  <text x="560" y="375" fill="#440022" font-size="7" transform="rotate(-15,560,375)">gravity fluctuates</text>
  <text x="220" y="640" fill="#440022" font-size="7" transform="rotate(10,220,640)">time feels sluggish</text>

  <!-- Scorched walls indicator -->
  <circle cx="400" cy="510" r="170" fill="none" stroke="#220010" stroke-width="8" opacity="0.7"/>

  <!-- Catwalks to chamber (entry walkways) -->
  <rect x="390" y="430" width="20" height="45" fill="#1a0010" stroke="#440022" stroke-width="1"/>
  <text x="430" y="455" fill="#440022" font-size="7">access walkway</text>

  <!-- THE RUPTURE (centre) -->
  <circle cx="400" cy="510" r="35" fill="url(#ruptureCore)" filter="url(#pulseglow)"/>
  <circle cx="400" cy="510" r="25" fill="#220011"/>
  <circle cx="400" cy="510" r="15" fill="#ff0066" opacity="0.8" filter="url(#pulseglow)"/>
  <text x="400" y="505" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="bold">THE</text>
  <text x="400" y="518" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="bold">RUPTURE</text>
  <text x="400" y="530" text-anchor="middle" fill="#ff88bb" font-size="7">~2m across</text>

  <!-- Containment generator units (needed for technical solution) -->
  <rect x="310" y="455" width="40" height="40" fill="#0a0010" stroke="#8800cc" stroke-width="2"/>
  <text x="330" y="470" text-anchor="middle" fill="#8800cc" font-size="7">CONT.</text>
  <text x="330" y="481" text-anchor="middle" fill="#8800cc" font-size="7">GEN</text>
  <text x="330" y="492" text-anchor="middle" fill="#6600aa" font-size="7">◈ KEY</text>

  <rect x="450" y="455" width="40" height="40" fill="#0a0010" stroke="#8800cc" stroke-width="2"/>
  <text x="470" y="470" text-anchor="middle" fill="#8800cc" font-size="7">CONT.</text>
  <text x="470" y="481" text-anchor="middle" fill="#8800cc" font-size="7">GEN</text>
  <text x="470" y="492" text-anchor="middle" fill="#6600aa" font-size="7">◈ KEY</text>

  <rect x="380" y="560" width="40" height="40" fill="#0a0010" stroke="#8800cc" stroke-width="2"/>
  <text x="400" y="575" text-anchor="middle" fill="#8800cc" font-size="7">CONT.</text>
  <text x="400" y="586" text-anchor="middle" fill="#8800cc" font-size="7">GEN</text>
  <text x="400" y="597" text-anchor="middle" fill="#6600aa" font-size="7">◈ KEY</text>

  <!-- Overload annotation -->
  <text x="550" y="475" fill="#8800cc" font-size="8">TECHNICAL SOLUTION:</text>
  <text x="550" y="487" fill="#6600aa" font-size="7">Overload all 3 containment</text>
  <text x="550" y="498" fill="#6600aa" font-size="7">generators simultaneously</text>
  <text x="550" y="509" fill="#6600aa" font-size="7">using research notes sequence</text>
  <text x="550" y="520" fill="#880055" font-size="7">→ collapses Rupture</text>
  <text x="550" y="531" fill="#880055" font-size="7">→ entity banished</text>
  <text x="550" y="542" fill="#880055" font-size="7">→ thralls die/catatonic</text>

  <!-- Residual body locations in chamber -->
  <text x="200" y="490" fill="#8b0000" font-size="12" opacity="0.7">†</text>
  <text x="560" y="540" fill="#8b0000" font-size="12" opacity="0.7">†</text>
  <text x="240" y="555" fill="#8b0000" font-size="12" opacity="0.7">†</text>
  <text x="175" y="490" fill="#660000" font-size="7">HAMMER-6</text>

  <!-- Distortion warning rings -->
  <circle cx="400" cy="510" r="100" fill="none" stroke="#ff0066" stroke-width="0.5" stroke-dasharray="3,6" opacity="0.3"/>
  <circle cx="400" cy="510" r="130" fill="none" stroke="#ff0066" stroke-width="0.5" stroke-dasharray="3,6" opacity="0.2"/>

  <!-- Legend -->
  <rect x="60" y="655" width="780" height="38" fill="#100008" stroke="#2a0020" stroke-width="1"/>
  <text x="80" y="669" fill="#ff44aa" font-size="8" font-weight="bold">LEGEND:</text>
  <circle cx="172" cy="666" r="5" fill="url(#ruptureCore)"/>
  <text x="182" y="670" fill="#ff44aa" font-size="8">THE RUPTURE</text>
  <rect x="262" y="661" width="10" height="6" fill="#0a0010" stroke="#8800cc" stroke-width="2"/>
  <text x="277" y="669" fill="#8800cc" font-size="8">CONTAINMENT GEN (overload = solution)</text>
  <rect x="492" y="661" width="10" height="6" fill="#0a0010" stroke="#4a8a2a" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="507" y="669" fill="#4a8a2a" font-size="8">WEAPONS CACHE</text>
  <text x="80" y="685" fill="#ff4444" font-size="8">⚠ KELLER ZONE</text>
  <text x="152" y="685" fill="#660000" font-size="8">†</text>
  <text x="160" y="685" fill="#8b0000" font-size="8">CORPSE</text>
  <text x="230" y="685" fill="#aa2266" font-size="8">◈ KEY ITEM</text>
  <text x="310" y="685" fill="#6600aa" font-size="8">◈ CLUE</text>
  <text x="640" y="685" fill="#550022" font-size="8" font-style="italic">Ebb-sensitives: all abilities affected near Rupture</text>

  <!-- Footer -->
  <text x="450" y="698" text-anchor="middle" fill="#2a0020" font-size="8" letter-spacing="1">POWER FAILURE — GM REFERENCE — NOT FOR PLAYER DISTRIBUTION</text>
</svg>