<svg viewBox="0 0 800 620" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a1a2a" stroke-width="0.5"/>
    </pattern>
    <filter id="flicker">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="redglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="620" fill="#08080f"/>
  <rect width="800" height="620" fill="url(#grid)"/>

  <!-- Title block -->
  <rect x="10" y="10" width="780" height="40" fill="#0d0d1a" stroke="#2a2a4a" stroke-width="1"/>
  <text x="400" y="30" text-anchor="middle" fill="#44aaff" font-size="14" font-weight="bold" letter-spacing="3">KELLER-VOSS PLANT — SUB-LEVEL 1</text>
  <text x="400" y="44" text-anchor="middle" fill="#2a2a6a" font-size="9" letter-spacing="2">OPERATIONS CONTROL / WORKER DORMITORIES  |  DEPTH: -6M</text>

  <!-- Outer walls -->
  <rect x="60" y="65" width="680" height="490" fill="#0a0a14" stroke="#2a2a4a" stroke-width="3"/>

  <!-- Main corridor (central horizontal) -->
  <rect x="60" y="280" width="680" height="60" fill="#0d0d1a" stroke="#1a1a3a" stroke-width="1"/>
  <text x="400" y="314" text-anchor="middle" fill="#1a1a4a" font-size="9" letter-spacing="3">— MAIN CORRIDOR —</text>

  <!-- Stairwells from ground level (north) -->
  <rect x="100" y="65" width="60" height="50" fill="#111120" stroke="#2a2a5a" stroke-width="1.5"/>
  <text x="130" y="85" text-anchor="middle" fill="#2a2a6a" font-size="8">STAIR</text>
  <text x="130" y="97" text-anchor="middle" fill="#2a2a6a" font-size="8">▲ GND</text>
  <text x="130" y="109" text-anchor="middle" fill="#2a4a6a" font-size="8">▼ SL2</text>

  <rect x="640" y="65" width="60" height="50" fill="#111120" stroke="#2a2a5a" stroke-width="1.5"/>
  <text x="670" y="85" text-anchor="middle" fill="#2a2a6a" font-size="8">STAIR</text>
  <text x="670" y="97" text-anchor="middle" fill="#2a2a6a" font-size="8">▲ GND</text>
  <text x="670" y="109" text-anchor="middle" fill="#2a4a6a" font-size="8">▼ SL2</text>

  <!-- Freight lift -->
  <rect x="360" y="65" width="80" height="50" fill="#111120" stroke="#2a2a5a" stroke-width="1.5"/>
  <text x="400" y="85" text-anchor="middle" fill="#2a2a6a" font-size="8">FREIGHT</text>
  <text x="400" y="97" text-anchor="middle" fill="#2a2a6a" font-size="8">LIFT</text>
  <text x="400" y="109" text-anchor="middle" fill="#2a4a6a" font-size="8">▲▼</text>

  <!-- OPERATIONS CONTROL ROOM (north-west quadrant) -->
  <rect x="80" y="115" width="260" height="155" fill="#0c0c18" stroke="#3a3a6a" stroke-width="2"/>
  <text x="210" y="135" text-anchor="middle" fill="#44aaff" font-size="10" font-weight="bold" letter-spacing="2">OPERATIONS</text>
  <text x="210" y="148" text-anchor="middle" fill="#44aaff" font-size="10" font-weight="bold" letter-spacing="2">CONTROL ROOM</text>

  <!-- Monitor banks -->
  <rect x="95" y="158" width="30" height="20" fill="#111130" stroke="#2a2a5a" stroke-width="1"/>
  <rect x="130" y="158" width="30" height="20" fill="#111130" stroke="#2a2a5a" stroke-width="1"/>
  <rect x="165" y="158" width="30" height="20" fill="#111130" stroke="#2a2a5a" stroke-width="1"/>
  <rect x="200" y="158" width="30" height="20" fill="#111130" stroke="#2a2a5a" stroke-width="1"/>
  <rect x="235" y="158" width="30" height="20" fill="#111130" stroke="#2a2a5a" stroke-width="1"/>
  <text x="210" y="170" text-anchor="middle" fill="#1a1a5a" font-size="7">DEAD MONITORS</text>

  <!-- THE FLICKERING TERMINAL -->
  <rect x="270" y="155" width="50" height="30" fill="#0a0a20" stroke="#44aaff" stroke-width="2" filter="url(#flicker)"/>
  <text x="295" y="168" text-anchor="middle" fill="#44aaff" font-size="7">◈ ACTIVE</text>
  <text x="295" y="179" text-anchor="middle" fill="#ff4444" font-size="7">LIVE FEED</text>
  <text x="340" y="162" fill="#ff4444" font-size="7" filter="url(#redglow)">⚠ FUTURE</text>
  <text x="340" y="173" fill="#ff4444" font-size="7" filter="url(#redglow)">TIMESTAMP</text>

  <!-- Control panels -->
  <rect x="95" y="195" width="220" height="25" fill="#111120" stroke="#2a2a5a" stroke-width="1"/>
  <text x="205" y="210" text-anchor="middle" fill="#2a2a5a" font-size="8">CONTROL PANELS (SHUTDOWN INCOMPLETE)</text>

  <!-- Room detail note -->
  <text x="210" y="240" text-anchor="middle" fill="#2a3a5a" font-size="8">Shutdown logs show final sequence</text>
  <text x="210" y="252" text-anchor="middle" fill="#2a3a5a" font-size="8">was never completed</text>
  <text x="210" y="264" text-anchor="middle" fill="#3a3a8a" font-size="8" font-style="italic">Something is watching in real time</text>

  <!-- WORKER DORMITORIES (north-east quadrant) -->
  <rect x="460" y="115" width="260" height="155" fill="#0c0c18" stroke="#3a3a5a" stroke-width="2"/>
  <text x="590" y="135" text-anchor="middle" fill="#7788aa" font-size="10" font-weight="bold" letter-spacing="2">WORKER DORMITORIES</text>

  <!-- Bunk beds layout -->
  <rect x="475" y="145" width="35" height="20" fill="#111120" stroke="#2a2a4a" stroke-width="1"/>
  <rect x="475" y="168" width="35" height="20" fill="#111120" stroke="#2a2a4a" stroke-width="1"/>
  <rect x="515" y="145" width="35" height="20" fill="#111120" stroke="#2a2a4a" stroke-width="1"/>
  <rect x="515" y="168" width="35" height="20" fill="#111120" stroke="#2a2a4a" stroke-width="1"/>
  <rect x="555" y="145" width="35" height="20" fill="#111120" stroke="#2a2a4a" stroke-width="1"/>
  <rect x="555" y="168" width="35" height="20" fill="#111120" stroke="#2a2a4a" stroke-width="1"/>
  <text x="553" y="165" fill="#1a1a4a" font-size="7">BUNKS</text>

  <!-- Lockers row -->
  <rect x="475" y="200" width="230" height="20" fill="#111120" stroke="#2a2a4a" stroke-width="1"/>
  <line x1="510" y1="200" x2="510" y2="220" stroke="#1a1a3a" stroke-width="1"/>
  <line x1="545" y1="200" x2="545" y2="220" stroke="#1a1a3a" stroke-width="1"/>
  <line x1="580" y1="200" x2="580" y2="220" stroke="#1a1a3a" stroke-width="1"/>
  <line x1="615" y1="200" x2="615" y2="220" stroke="#1a1a3a" stroke-width="1"/>
  <line x1="650" y1="200" x2="650" y2="220" stroke="#1a1a3a" stroke-width="1"/>
  <text x="590" y="213" text-anchor="middle" fill="#2a2a5a" font-size="7">LOCKERS</text>

  <!-- Trell's locker highlight -->
  <rect x="650" y="200" width="35" height="20" fill="#0a0a20" stroke="#ffaa00" stroke-width="2"/>
  <text x="667" y="213" text-anchor="middle" fill="#ffaa00" font-size="7">◈ KEY</text>
  <text x="720" y="208" fill="#ffaa00" font-size="8">TRELL'S NOTE</text>
  <text x="720" y="219" fill="#aa6600" font-size="7">locker — HAMMER-6</text>
  <line x1="685" y1="210" x2="718" y2="210" stroke="#ffaa00" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Personal effects -->
  <text x="590" y="240" text-anchor="middle" fill="#2a2a4a" font-size="8" font-style="italic">Photographs. Clothing.</text>
  <text x="590" y="252" text-anchor="middle" fill="#2a2a4a" font-size="8" font-style="italic">Child's toy on bunk 3.</text>
  <text x="590" y="264" text-anchor="middle" fill="#2a2a4a" font-size="8" font-style="italic">Personal effects, abandoned.</text>

  <!-- SECURITY OFFICE (south-west) -->
  <rect x="80" y="350" width="160" height="100" fill="#0c0c18" stroke="#2a2a4a" stroke-width="1.5"/>
  <text x="160" y="368" text-anchor="middle" fill="#2a4a6a" font-size="9" letter-spacing="1">SECURITY OFFICE</text>
  <text x="160" y="382" text-anchor="middle" fill="#1a2a4a" font-size="8">(cleared / abandoned)</text>
  <rect x="95" y="390" width="50" height="30" fill="#0a0a18" stroke="#1a1a3a" stroke-width="1"/>
  <text x="120" y="408" text-anchor="middle" fill="#1a1a3a" font-size="7">DESK</text>
  <rect x="160" y="390" width="30" height="40" fill="#0a0a18" stroke="#1a1a3a" stroke-width="1"/>
  <text x="175" y="415" text-anchor="middle" fill="#1a1a3a" font-size="7">FILE</text>

  <!-- MAINTENANCE OFFICE (south-east) -->
  <rect x="560" y="350" width="160" height="100" fill="#0c0c18" stroke="#2a2a4a" stroke-width="1.5"/>
  <text x="640" y="368" text-anchor="middle" fill="#2a4a6a" font-size="9" letter-spacing="1">MAINTENANCE OFFICE</text>
  <rect x="575" y="380" width="50" height="30" fill="#0a0a18" stroke="#1a1a3a" stroke-width="1"/>
  <rect x="635" y="380" width="50" height="30" fill="#0a0a18" stroke="#1a1a3a" stroke-width="1"/>
  <text x="640" y="425" text-anchor="middle" fill="#1a2a4a" font-size="8">Blueprint files (incomplete)</text>

  <!-- STORAGE ROOMS (south corridor) -->
  <rect x="80" y="460" width="100" height="75" fill="#0a0a14" stroke="#1a1a3a" stroke-width="1"/>
  <text x="130" y="480" text-anchor="middle" fill="#1a1a3a" font-size="8">STORAGE</text>
  <text x="130" y="492" text-anchor="middle" fill="#1a1a3a" font-size="8">A</text>

  <rect x="200" y="460" width="100" height="75" fill="#0a0a14" stroke="#1a1a3a" stroke-width="1"/>
  <text x="250" y="480" text-anchor="middle" fill="#1a1a3a" font-size="8">STORAGE</text>
  <text x="250" y="492" text-anchor="middle" fill="#1a1a3a" font-size="8">B</text>

  <rect x="500" y="460" width="100" height="75" fill="#0a0a14" stroke="#1a1a3a" stroke-width="1"/>
  <text x="550" y="480" text-anchor="middle" fill="#1a1a3a" font-size="8">STORAGE</text>
  <text x="550" y="492" text-anchor="middle" fill="#1a1a3a" font-size="8">C</text>

  <rect x="620" y="460" width="100" height="75" fill="#0a0a14" stroke="#1a1a3a" stroke-width="1"/>
  <text x="670" y="480" text-anchor="middle" fill="#1a1a3a" font-size="8">STORAGE</text>
  <text x="670" y="492" text-anchor="middle" fill="#1a1a3a" font-size="8">D</text>

  <!-- JUNCTION to SL2 (false panel location hint) -->
  <rect x="320" y="350" width="160" height="100" fill="#0c0c14" stroke="#3a2a5a" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="400" y="368" text-anchor="middle" fill="#3a2a6a" font-size="9" letter-spacing="1">MAINTENANCE</text>
  <text x="400" y="381" text-anchor="middle" fill="#3a2a6a" font-size="9" letter-spacing="1">JUNCTION</text>
  <text x="400" y="400" text-anchor="middle" fill="#5a3a8a" font-size="8">FALSE PANEL</text>
  <text x="400" y="413" text-anchor="middle" fill="#5a3a8a" font-size="8">→ CONCEALED WING</text>
  <text x="400" y="430" text-anchor="middle" fill="#3a2a5a" font-size="7">Keycard required</text>
  <text x="400" y="442" text-anchor="middle" fill="#3a2a5a" font-size="7">Leads to Sub-Level 2</text>

  <!-- Ozone smell indicator -->
  <text x="400" y="470" text-anchor="middle" fill="#2a2a5a" font-size="8" font-style="italic">Air smells of ozone below this level</text>
  <text x="400" y="482" text-anchor="middle" fill="#2a2a5a" font-size="8" font-style="italic">Ebb-sensitives feel pull of the Rupture</text>

  <!-- Stairwells down to SL2/SL3 (south) -->
  <rect x="310" y="500" width="60" height="50" fill="#111120" stroke="#3a2a5a" stroke-width="1.5"/>
  <text x="340" y="520" text-anchor="middle" fill="#3a2a6a" font-size="8">STAIR</text>
  <text x="340" y="532" text-anchor="middle" fill="#3a2a6a" font-size="8">▼ SL2</text>
  <text x="340" y="544" text-anchor="middle" fill="#5a2a8a" font-size="8">▼ SL3</text>

  <rect x="430" y="500" width="60" height="50" fill="#111120" stroke="#3a2a5a" stroke-width="1.5"/>
  <text x="460" y="520" text-anchor="middle" fill="#3a2a6a" font-size="8">STAIR</text>
  <text x="460" y="532" text-anchor="middle" fill="#3a2a6a" font-size="8">▼ SL2</text>
  <text x="460" y="544" text-anchor="middle" fill="#5a2a8a" font-size="8">▼ SL3</text>

  <!-- Legend -->
  <rect x="60" y="566" width="680" height="46" fill="#0d0d1a" stroke="#1a1a3a" stroke-width="1"/>
  <text x="80" y="581" fill="#44aaff" font-size="8" font-weight="bold">LEGEND:</text>
  <rect x="80" y="586" width="10" height="6" fill="#0a0a20" stroke="#44aaff" stroke-width="1.5"/>
  <text x="95" y="594" fill="#44aaff" font-size="8">CONTROL ROOM</text>
  <rect x="190" y="586" width="10" height="6" fill="#0a0a20" stroke="#ffaa00" stroke-width="2"/>
  <text x="205" y="594" fill="#ffaa00" font-size="8">KEY ITEM</text>
  <rect x="280" y="586" width="10" height="6" fill="#0a0a18" stroke="#3a2a5a" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="295" y="594" fill="#5a3a8a" font-size="8">HIDDEN / CONCEALED</text>
  <rect x="440" y="586" width="10" height="6" fill="none" stroke="#ff4444" stroke-width="1.5"/>
  <text x="455" y="594" fill="#ff4444" font-size="8">ANOMALY / WARNING</text>
  <rect x="585" y="586" width="10" height="6" fill="#111120" stroke="#3a2a5a" stroke-width="1.5"/>
  <text x="600" y="594" fill="#3a2a6a" font-size="8">STAIR / DESCENT</text>

  <!-- Footer -->
  <text x="400" y="610" text-anchor="middle" fill="#1a1a3a" font-size="8" letter-spacing="1">POWER FAILURE — GM REFERENCE — NOT FOR PLAYER DISTRIBUTION</text>
</svg>